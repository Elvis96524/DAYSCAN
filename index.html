<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0e14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DayScan">
<title>DayScan · 美股日内交易扫描器</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { --bg:#0b0e14; --panel:#11151d; --line:#1f2633; --txt:#d5dbe6; --mute:#7a8599; --up:#26d98b; --down:#ff5c6c; --acc:#4aa3ff; }
  html,body { background:var(--bg); color:var(--txt); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; }
  .up { color:var(--up); } .down { color:var(--down); } .mute { color:var(--mute); }
  .row { border-bottom:1px solid var(--line); cursor:pointer; transition:background .12s; }
  .row:hover { background:#161c28; }
  .row.active { background:#16243a; box-shadow: inset 3px 0 0 var(--acc); }
  .pick { background:#0e121a; border:1px solid var(--line); border-radius:8px; cursor:pointer; transition:border-color .12s; }
  .pick:hover { border-color:var(--acc); }
  .pick.sel { border-color:var(--acc); box-shadow: inset 3px 0 0 var(--acc); }
  .btn { border:1px solid var(--line); background:#161c28; border-radius:6px; padding:6px 12px; font-size:12px; transition:all .12s; }
  .btn:hover { border-color:var(--acc); color:#fff; }
  .btn-primary { background:#1b4a86; border-color:#2a6bc0; color:#fff; }
  .btn-primary:hover { background:#2260ad; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  select.btn { padding:5px 8px; cursor:pointer; color:var(--txt); }
  select.btn option { background:#11151d; color:#d5dbe6; }
  input[type=number], input[type=text], input[type=password] { background:#0b0e14; border:1px solid var(--line); border-radius:6px; padding:4px 8px; color:var(--txt); font-size:12px; width:100%; }
  .switch { position:relative; width:42px; height:22px; background:#2a3242; border-radius:999px; cursor:pointer; transition:.2s; flex:none; }
  .switch::after { content:""; position:absolute; top:3px; left:3px; width:16px; height:16px; background:#fff; border-radius:50%; transition:.2s; }
  .switch.live { background:#c2410c; } .switch.live::after { left:23px; }
  .badge { font-size:10px; padding:1px 6px; border-radius:4px; border:1px solid var(--line); display:inline-block; }
  ::-webkit-scrollbar { width:8px; height:8px; } ::-webkit-scrollbar-thumb { background:#252d3d; border-radius:4px; }
  #toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:#1c2332; border:1px solid var(--line); padding:8px 16px; border-radius:8px; font-size:12px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:50; max-width:90vw; }
  #toast.show { opacity:1; }
</style>
</head>
<body class="min-h-screen flex flex-col">

<!-- ===================== 头部 / Header ===================== -->
<header class="flex flex-wrap items-center gap-3 px-4 py-3 border-b" style="border-color:var(--line)">
  <div class="flex items-center gap-2">
    <span class="text-lg font-bold tracking-wider" style="color:var(--acc)">▌DAYSCAN</span>
    <span class="mute text-xs hidden sm:inline" data-i18n="sub"></span>
  </div>

  <div class="ml-auto flex flex-wrap items-center gap-3 text-xs">
    <!-- API 额度计数器 -->
    <div class="panel px-3 py-1.5 flex items-center gap-2" data-i18n-title="quotaTip">
      <span class="mute" data-i18n="quotaLabel"></span>
      <span id="quotaText" class="font-bold">0 / 250</span>
      <div class="w-20 h-1.5 rounded overflow-hidden" style="background:#222a39"><div id="quotaBar" class="h-full" style="width:0;background:var(--up)"></div></div>
      <span class="mute"><span data-i18n="quotaLeftLabel"></span> <b id="quotaLeft" class="text-white">250</b></span>
    </div>

    <!-- 语言切换 / Language -->
    <select id="langSel" class="btn" aria-label="Language / 语言">
      <option value="zh">🌐 中文</option>
      <option value="en">🌐 English</option>
    </select>

    <button id="btnKey" class="btn">🔑 API Key</button>

    <!-- 测试 / 真实 切换 -->
    <div class="flex items-center gap-2">
      <span id="modeMock" class="font-bold" data-i18n="modeMock"></span>
      <div id="modeSwitch" class="switch" role="switch" data-i18n-aria="modeAria"></div>
      <span id="modeLive" class="mute" data-i18n="modeLive"></span>
    </div>
  </div>
</header>

<!-- API Key 设置条 -->
<div id="keyBar" class="hidden px-4 py-3 border-b text-xs" style="border-color:var(--line);background:#0e121a">
  <div class="flex flex-wrap items-center gap-2 max-w-3xl">
    <span class="mute" data-i18n="keyHint"></span>
    <input id="keyInput" type="password" data-i18n-ph="keyPh" class="flex-1 min-w-[220px]" style="width:auto">
    <button id="keySave" class="btn btn-primary" data-i18n="save"></button>
    <button id="keyClear" class="btn" data-i18n="clear"></button>
  </div>
</div>

<!-- ===================== 主体 / Main ===================== -->
<main class="flex-1 grid gap-3 p-3 lg:grid-cols-[380px_1fr] min-h-0">

  <!-- 左：扫描面板 -->
  <section class="panel flex flex-col min-h-[420px] lg:h-[calc(100vh-120px)]">
    <div class="p-3 border-b" style="border-color:var(--line)">
      <div class="flex items-center justify-between mb-2">
        <h2 class="font-bold text-sm"><span data-i18n="scanTitle"></span> <span id="countBadge" class="badge mute">0</span></h2>
        <button id="btnRefresh" class="btn btn-primary" data-i18n="refresh"></button>
      </div>
      <div id="scanMeta" class="mute text-[11px] mb-2"></div>
      <div class="grid grid-cols-4 gap-2 text-[11px]">
        <label><span data-i18n="fChg"></span><input id="fChg" type="number" step="0.5" value="3"></label>
        <label><span data-i18n="fRvol"></span><input id="fRvol" type="number" step="0.1" value="2.0"></label>
        <label><span data-i18n="fMin"></span><input id="fMin" type="number" step="0.5" value="1"></label>
        <label><span data-i18n="fMax"></span><input id="fMax" type="number" step="1" value="50"></label>
      </div>
      <label class="flex items-center gap-2 text-[11px] mt-2 cursor-pointer"><input id="rvolAdj" type="checkbox" checked style="width:auto"><span data-i18n="rvolAdjLabel"></span></label>
      <div class="mute text-[10px] mt-1" data-i18n="filterHint"></div>
    </div>
    <div id="scanList" class="flex-1 overflow-y-auto text-sm"></div>
    <div class="px-3 py-2 border-t mute text-[10px]" style="border-color:var(--line)" data-i18n="scanFoot"></div>
  </section>

  <!-- 右：建议入手 + 风控 -->
  <section class="flex flex-col gap-3 min-w-0">

    <!-- ⭐ 建议入手区 -->
    <div class="panel p-4" id="picksCard">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <h3 class="font-bold text-sm">⭐ <span data-i18n="picksTitle"></span> <span id="picksBadge" class="badge mute">0</span></h3>
        <span class="mute text-[10px]" data-i18n="picksSub"></span>
      </div>

      <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-2 text-[11px] my-3">
        <label><span data-i18n="pCap"></span><input id="pCap" type="number" min="1" step="50" value="1000"></label>
        <label><span data-i18n="pRisk"></span><input id="pRisk" type="number" min="0.1" step="0.25" value="1"></label>
        <label><span data-i18n="pStop"></span><input id="pStop" type="number" min="0.5" step="0.5" value="3"></label>
        <label><span data-i18n="pRR"></span><input id="pRR" type="number" min="0.5" step="0.5" value="2"></label>
        <label><span data-i18n="pPull"></span><input id="pPull" type="number" min="0" step="0.1" value="0.5"></label>
        <label><span data-i18n="pCost"></span><input id="pCost" type="number" min="0" step="0.1" value="0.3"></label>
      </div>

      <div id="picksList" class="space-y-2"></div>
      <div class="mute text-[10px] mt-3 leading-relaxed" data-i18n="picksDisclaimer"></div>
    </div>

    <!-- eToro 风控卡片 -->
    <div class="panel p-4" id="riskCard">
      <div class="flex flex-wrap items-center gap-3 mb-3">
        <div>
          <div class="flex items-baseline gap-3">
            <span id="selSym" class="text-2xl font-bold">—</span>
            <span id="selPrice" class="text-xl"></span>
            <span id="selChg" class="text-sm"></span>
          </div>
          <div id="selName" class="mute text-xs"></div>
        </div>
        <div class="ml-auto flex items-center gap-2">
          <span id="sessionBadge" class="badge"></span>
          <button id="btnCopy" class="btn" disabled data-i18n="copyBtn"></button>
        </div>
      </div>

      <h3 class="font-bold text-sm flex items-center gap-2 mb-3">
        <span class="inline-block w-2 h-2 rounded-full" style="background:#7cc242"></span> <span data-i18n="riskTitle"></span>
      </h3>

      <div class="grid md:grid-cols-3 gap-3 text-xs">
        <div class="p-3 rounded-md" style="background:#0e121a;border:1px solid var(--line)">
          <div class="mute mb-1" data-i18n="liqTitle"></div>
          <div id="liqLevel" class="text-base font-bold">—</div>
          <div id="liqNote" class="mute mt-1 leading-relaxed"></div>
        </div>
        <div class="p-3 rounded-md" style="background:#0e121a;border:1px solid #6b4a12">
          <div class="mb-1" style="color:#f5a524" data-i18n="orderTitle"></div>
          <div class="font-bold text-sm" data-i18n="orderMain"></div>
          <div class="mute mt-1 leading-relaxed" data-i18n="orderDesc"></div>
        </div>
        <div class="p-3 rounded-md" style="background:#0e121a;border:1px solid var(--line)">
          <div class="mute mb-1" data-i18n="refTitle"></div>
          <div class="space-y-0.5">
            <div><span data-i18n="plEntry"></span>：<b id="rkEntry">—</b></div>
            <div><span data-i18n="plStop"></span>：<b id="rkStop">—</b></div>
            <div><span data-i18n="plTarget"></span>：<b id="rkTarget">—</b></div>
            <div><span data-i18n="plSize"></span>：<b id="rkSize">—</b></div>
          </div>
          <div id="rkRiskLine" class="mute mt-1 text-[10px]"></div>
          <div class="mute mt-1 text-[10px]" data-i18n="refNote"></div>
        </div>
      </div>

      <ul class="mute text-[11px] mt-3 space-y-1 list-disc pl-5">
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
      </ul>
    </div>
  </section>
</main>

<div id="toast"></div>

function detectLang(){
  const saved = (()=>{ try { return JSON.parse(localStorage.getItem('dt_lang')); } catch { return null; } })();
  if(saved && I18N[saved]) return saved;
  return (navigator.language||'').toLowerCase().startsWith('zh') ? 'zh' : 'en';
}

  const s = (I18N[LANG] && I18N[LANG][key]) ?? I18N.zh[key] ?? key;
  return vars ? s.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? '') : s;
}

function quota(){ const q = lsGet(LS.quota, {day:utcDay(), used:0}); if(q.day!==utcDay()) return {day:utcDay(), used:0}; return q; }
function renderQuota(){
  const q = quota(), left = Math.max(0, DAILY_LIMIT - q.used), pct = Math.min(100, q.used/DAILY_LIMIT*100);
  $('quotaText').textContent = `${q.used} / ${DAILY_LIMIT}`;

}

/* ---------------------------- FMP 请求封装 ---------------------------- */
async function fmp(path, params={}){
  const key = getKey();
  if(!key) throw new Error(t('errNoKey'));
  if(quota().used >= DAILY_LIMIT) throw new Error(t('errQuota'));
  const url = new URL(FMP_BASE + path);
  Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));
  url.searchParams.set('apikey', key);
  addQuota(1);                                   // 发出请求即计数
  const res = await fetch(url.toString());
  let data = null; try { data = await res.json(); } catch {}
  if(!res.ok){
    const msg = (data && (data['Error Message'] || data.message)) || res.statusText;
    throw new Error(`FMP ${res.status}: ${msg}`);
  }
  if(data && !Array.isArray(data) && (data['Error Message'] || data.message)) throw new Error(data['Error Message'] || data.message);
  return data;
}

const num = v => (v==null||v==='') ? null : Number(v);

async function loadScanLive(){
  const warns = []; let batchFailed = false;
  // 请求1+2：涨幅榜（核心）+ 最活跃榜（失败不影响主流程）
  const [g, a] = await Promise.allSettled([ fmp('/biggest-gainers'), fmp('/most-actives') ]);
  if(g.status==='rejected') throw g.reason;
  if(a.status==='rejected') warns.push(t('activesFail',{msg:a.reason.message}));
  const list = [ ...(Array.isArray(g.value)?g.value:[]), ...(a.status==='fulfilled' && Array.isArray(a.value) ? a.value : []) ];
  const map = new Map();
  list.forEach(r => {
    const sym = r.symbol; if(!sym || map.has(sym)) return;
    map.set(sym, { symbol:sym, name:r.name||'', price:num(r.price), changePct:num(r.changesPercentage ?? r.changePercentage ?? r.changePercent), volume:null, avgVolume:null });
  });
  // 预过滤（价格&涨幅，必须是有效数字）后再取量能数据，减少 batch 请求规模
  const fMin=+$('fMin').value, fMax=+$('fMax').value, fChg=+$('fChg').value;
  const cands = [...map.values()].filter(r => Number.isFinite(r.price) && Number.isFinite(r.changePct) && r.price>=fMin && r.price<=fMax && r.changePct>fChg).slice(0,60);
  // 请求3：批量报价 → 取 volume / avgVolume
  if(cands.length){
    try{
      const q = await fmp('/batch-quote', { symbols: cands.map(c=>c.symbol).join(',') });
      const qm = new Map((Array.isArray(q)?q:[]).map(x=>[x.symbol,x]));
      cands.forEach(c => {
        const x = qm.get(c.symbol); if(!x) return;
        c.price = num(x.price) ?? c.price;
        c.changePct = num(x.changePercentage ?? x.changesPercentage) ?? c.changePct;
        c.volume = num(x.volume); c.avgVolume = num(x.avgVolume ?? x.averageVolume);
      });
    }catch(e){
      batchFailed = true;
      warns.push(t('batchFail',{msg:e.message}));
    }
  }
  return { rows:cands, warns, batchFailed };
}

/* =====================================================================
 *  交易时段 / 流动性 / 评分 / 交易计划
 * ===================================================================== */
function sessionInfo(date){
  const p = new Intl.DateTimeFormat('en-US',{ timeZone:'America/New_York', year:'numeric', month:'2-digit', day:'2-digit', weekday:'short', hour:'2-digit', minute:'2-digit', hour12:false }).formatToParts(date);
  const g = ty => p.find(x=>x.type===ty).value;
  const day = `${g('year')}-${g('month')}-${g('day')}`, wd = g('weekday'), min = (+g('hour')%24)*60 + +g('minute');
  const base = { min, day, closeMin:960 };
  if(wd==='Sat'||wd==='Sun') return { ...base, key:'closed', label:t('sessWeekend'), color:'#7a8599' };
  if(US_HOLIDAYS[day])        return { ...base, key:'closed', label:t('sessHoliday'), color:'#7a8599' };
  const early = !!US_EARLY_CLOSE[day], closeMin = early ? 780 : 960, afterEnd = early ? 1020 : 1200, tag = early ? t('earlyTag') : '';
  const o = { ...base, closeMin };
  if(min>=240 && min<570)        return { ...o, key:'pre',     label:t('sessPre'),     color:'#f5a524' };
  if(min>=570 && min<585)        return { ...o, key:'open',    label:t('sessOpen')+tag, color:'#ff8a3d' };
  if(min>=585 && min<closeMin)   return { ...o, key:'regular', label:t('sessRegular')+tag, color:'#26d98b' };
  if(min>=closeMin && min<afterEnd) return { ...o, key:'after', label:t('sessAfter'),   color:'#f5a524' };
  return { ...o, key:'closed', label:t('sessClosed'), color:'#7a8599' };
}
const etSession = () => sessionInfo(new Date());
const isOffHours = ses => ['pre','after','open'].includes(ses.key);

/* 预计「此时已完成的全天成交量比例」。date 应取数据抓取的时间，而不是现在。 */
function volFraction(date){
  const s = sessionInfo(date);
  if(s.key==='pre') return { frac:VOL_FLOOR, floor:true };
  if(s.key==='open' || s.key==='regular'){
    const off = Math.max(0, Math.min(390, (s.min-570)*390/(s.closeMin-570)));   // 提前收市日按比例拉伸
    let f = 1;
    for(let i=1;i<VOL_CURVE.length;i++){
      const [x0,y0]=VOL_CURVE[i-1], [x1,y1]=VOL_CURVE[i];
      if(off<=x1){ f = y0+(y1-y0)*(off-x0)/(x1-x0); break; }
    }
    return { frac:Math.max(VOL_FLOOR,f), floor:f<VOL_FLOOR };
  }
  return { frac:1, floor:false };      // 盘后 / 休市：成交量已是（接近）全天数据
}
/* 计算每只股票的 RVOL（原始 & 折算），折算按数据抓取时刻；模拟数据不折算 */
function applyRvol(){
  state.rvolOn = $('rvolAdj').checked;
  const vf = state.live && state.rvolOn ? volFraction(state.scanTs ? new Date(state.scanTs) : new Date()) : { frac:1, floor:false };
  state.rvolFrac = vf.frac; state.rvolFloor = vf.floor;
  state.raw.forEach(r => {
    if(r.volume>0 && r.avgVolume>0){
      r.rvolRaw = +(r.volume/r.avgVolume).toFixed(2);
      r.rvol = (r.mock || !state.live) ? r.rvolRaw : +(r.rvolRaw/vf.frac).toFixed(2);
    } else { r.rvolRaw = null; r.rvol = null; }
  });
}

function liquidityEstimate(s, ses){
  // 经验性启发式：低价股、低成交量、非常规时段 → 点差更大。并非真实报价点差。
  let score = 0;
  if(s.price < 3) score += 2; else if(s.price < 10) score += 1;
  if(s.volume != null){ if(s.volume < 500000) score += 2; else if(s.volume < 2000000) score += 1; }
  if(s.rvol != null && s.rvol > 8) score += 1;                     // 极端放量常伴随点差剧烈波动
  if(Math.abs(s.changePct) > 15) score += 1;
  if(isOffHours(ses)) score += 2;
  if(ses.key==='closed') score += 1;
  if(score >= 5) return { lvl:'bad',  lv:t('liqBad'),  color:'var(--down)', note:t('liqBadNote') };
  if(score >= 3) return { lvl:'mid',  lv:t('liqMid'),  color:'#f5a524',     note:t('liqMidNote') };
  return               { lvl:'good', lv:t('liqGood'), color:'var(--up)',   note:t('liqGoodNote') };
}

/* 规则打分（0–100）：涨幅 35 + RVOL 30 + 成交量 20 + 价格区间 10，归一化后扣除时段惩罚 */
function scoreStock(s, ses){
  const c = s.changePct, r = s.rvol, v = s.volume, p = s.price;
  const mom = c<3 ? 0 : c<=12 ? 15+20*(c-3)/9 : c<=20 ? 35-15*(c-12)/8 : Math.max(0, 20-(c-20));
  const rv  = r==null ? 10 : r<2 ? 0 : Math.min(30, 15+15*(r-2)/4);
  const vol = v==null ? 8 : v>=5e6 ? 20 : v>=2e6 ? 14+6*(v-2e6)/3e6 : v>=5e5 ? 6+8*(v-5e5)/1.5e6 : 6*v/5e5;
  const pr  = (p>=3 && p<=30) ? 10 : (p>30 && p<=50) ? 7 : (p>=1 && p<3) ? 4 : 0;
  const pen = isOffHours(ses) ? 8 : ses.key==='closed' ? 3 : 0;
  const score = Math.round(Math.max(0, Math.min(100, (mom+rv+vol+pr)/95*100 - pen)));
  const liq = liquidityEstimate(s, ses);
  let grade = score>=70 ? 'strong' : score>=50 ? 'watch' : 'skip';
  if(liq.lvl==='bad') grade = 'skip';
  else if(r==null && grade==='strong') grade = 'watch';      // 没有量能数据，不能给最高评级

  const reasons = [];
  if(c>20) reasons.push({tone:'bad',  txt:t('rsnMomHot',{v:fmt(c,1)})});
  else if(c>=3) reasons.push({tone:'good', txt:t('rsnMomOk',{v:fmt(c,1)})});
  else reasons.push({tone:'warn', txt:t('rsnMomWeak',{v:fmt(c,1)})});
  if(r==null) reasons.push({tone:'warn', txt:t('rsnRvolNA')});
  else if(r>=3) reasons.push({tone:'good', txt:t('rsnRvolHigh',{v:fmt(r,1)})});
  else if(r>=2) reasons.push({tone:'neutral', txt:t('rsnRvolOk',{v:fmt(r,1)})});
  else reasons.push({tone:'warn', txt:t('rsnRvolLow',{v:fmt(r,1)})});
  if(v!=null){
    if(v>=2e6) reasons.push({tone:'good', txt:t('rsnVolHigh',{v:fmtVol(v)})});
    else if(v<5e5) reasons.push({tone:'warn', txt:t('rsnVolLow',{v:fmtVol(v)})});
  }
  if(p<3) reasons.push({tone:'warn', txt:t('rsnPriceLow')});
  if(isOffHours(ses)) reasons.push({tone:'warn', txt:t('rsnSess')});
  if(liq.lvl==='bad') reasons.push({tone:'bad', txt:t('rsnLiqBad')});
  return { score, grade, reasons, liq };
}

/* 风险参数（本金/单笔风险/止损幅度/盈亏比），保存在本机 */
function loadRiskInputs(){
  const d = lsGet(LS.risk, null); if(!d) return;
  [['cap','pCap'],['risk','pRisk'],['stop','pStop'],['rr','pRR'],['pull','pPull'],['cost','pCost']].forEach(([k,id]) => { if(d[k]!=null) $(id).value = d[k]; });
}
function saveRiskInputs(){ lsSet(LS.risk, { cap:$('pCap').value, risk:$('pRisk').value, stop:$('pStop').value, rr:$('pRR').value, pull:$('pPull').value, cost:$('pCost').value }); }

/* 交易计划：
 *  有效风险% = 止损% + 往返点差%；仓位 = 可承受亏损 ÷ 有效风险%（不加杠杆，封顶本金）；
 *  目标涨幅% = 有效风险% × 盈亏比 + 点差%，使「扣除点差后」的净盈亏比等于你设定的 R:R。 */
function tradePlan(s){
  const cap=+$('pCap').value, risk=+$('pRisk').value, stop=+$('pStop').value, rr=+$('pRR').value;
  const pull=+$('pPull').value, cost=+$('pCost').value;
  if(!(cap>0 && risk>0 && stop>0 && rr>0) || !(pull>=0) || !(cost>=0)) return { valid:false };
  const eff = stop + cost;
  const entry = s.price*(1-pull/100);
  const stopPx = entry*(1-stop/100), target = entry*(1+(eff*rr+cost)/100);
  let pos = (cap*risk/100)/(eff/100), capped = false;
  if(pos>cap){ pos = cap; capped = true; }
  return { valid:true, entry, stopPx, target, pos, capped, units:pos/entry, riskUsd:pos*eff/100, gainUsd:pos*eff*rr/100 };
}
const usd = n => '$'+Number(n).toFixed(2);

/* =====================================================================
 *  ⭐ 建议入手区
 * ===================================================================== */
const TONE = { good:'#26d98b', warn:'#f5a524', bad:'#ff5c6c', neutral:'#7a8599' };

function renderPicks(){
  const ses = etSession();
  const rows = state.raw.filter(passFilter).map(s => ({ s, ...scoreStock(s, ses) })).sort((a,b)=>b.score-a.score).slice(0, TOP_N);
  $('picksBadge').textContent = rows.length;
  const box = $('picksList');
  if(!rows.length){ box.innerHTML = `<div class="p-4 text-center mute text-xs">${t('picksEmpty')}</div>`; return; }
  const G = { strong:{txt:t('gradeStrong'),color:'#26d98b'}, watch:{txt:t('gradeWatch'),color:'#f5a524'}, skip:{txt:t('gradeSkip'),color:'#7a8599'} };
  box.innerHTML = rows.map((r,i) => {
    const s = r.s, g = G[r.grade], pl = tradePlan(s);
    const chips = r.reasons.map(x => `<span class="badge" style="color:${TONE[x.tone]};border-color:${TONE[x.tone]}55">${esc(x.txt)}</span>`).join(' ');
    const plan = pl.valid ? `
      <div class="grid grid-cols-2 md:grid-cols-4 gap-2 text-[11px] mt-2">
        <div><div class="mute">${t('plEntry')}</div><b>${usd(pl.entry)}</b></div>
        <div><div class="mute">${t('plStop')}</div><b class="down">${usd(pl.stopPx)}</b></div>
        <div><div class="mute">${t('plTarget')}</div><b class="up">${usd(pl.target)}</b></div>
        <div><div class="mute">${t('plSize')}</div><b>$${Math.round(pl.pos)}</b> <span class="mute">${t('plUnits',{u:fmt(pl.units,2)})}</span></div>
      </div>
      <div class="mute text-[10px] mt-1">${t('plRiskLine',{risk:fmt(pl.riskUsd,2), gain:fmt(pl.gainUsd,2)})} ${pl.capped?t('plCapped'):''}</div>`
      : `<div class="mute text-[11px] mt-2">${t('plInvalid')}</div>`;
    return `
    <div class="pick p-3 ${state.selected?.symbol===s.symbol?'sel':''}" data-sym="${esc(s.symbol)}">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-baseline gap-2">
          <span class="mute text-xs">#${i+1}</span>
          <b class="text-base">${esc(s.symbol)}</b>
          <span class="up text-xs font-bold">+${fmt(s.changePct)}%</span>
          <span class="mute text-xs">$${fmt(s.price)}</span>
        </div>
        <div class="flex items-center gap-2">
          <span class="badge" style="color:${g.color};border-color:${g.color}66">${g.txt}</span>
          <span class="text-xs mute">${t('score')} <b style="color:${g.color}">${r.score}</b></span>
          <button class="btn pcopy" style="padding:2px 8px" data-sym="${esc(s.symbol)}">📋</button>
        </div>
      </div>
      <div class="mute text-[11px] truncate">${esc(s.name)}</div>
      <div class="h-1 rounded mt-2 overflow-hidden" style="background:#222a39"><div class="h-full" style="width:${r.score}%;background:${g.color}"></div></div>
      <div class="flex flex-wrap gap-1 mt-2">${chips}</div>
      ${plan}
    </div>`;
  }).join('');
  box.querySelectorAll('.pick').forEach(el => el.onclick = () => selectStock(el.dataset.sym, true));
  box.querySelectorAll('.pcopy').forEach(b => b.onclick = e => { e.stopPropagation(); copySym(b.dataset.sym); });
}

/* =====================================================================
 *  选中股票 + eToro 风控卡片（纯本地，不请求 API）
 * ===================================================================== */
function selectStock(sym, scroll=false){
  const stock = state.raw.find(r=>r.symbol===sym); if(!stock) return;
  state.selected = stock;
  renderScan(); renderPicks(); renderSelected();
  $('btnCopy').disabled = false;
  if(scroll && window.matchMedia('(max-width:1023px)').matches) $('riskCard').scrollIntoView({ behavior:'smooth', block:'start' });
}

function renderSession(){
  const ses = etSession(), sb = $('sessionBadge');
  sb.textContent = ses.label; sb.style.color = ses.color; sb.style.borderColor = ses.color;
  return ses;
}

function renderSelected(){
  const s = state.selected, ses = renderSession();
  if(!s){
    $('selSym').textContent = '—'; $('selPrice').textContent = ''; $('selChg').textContent = '';
    $('selName').textContent = t('selectHint');
    ['liqLevel','rkEntry','rkStop','rkTarget','rkSize'].forEach(id => { $(id).textContent = '—'; });
    $('liqLevel').style.color = ''; $('liqNote').textContent = ''; $('rkRiskLine').textContent = '';
    $('btnCopy').disabled = true;
    return;
  }
  $('selSym').textContent = s.symbol;
  $('selPrice').textContent = '$'+fmt(s.price);
  $('selChg').innerHTML = `<span class="${s.changePct>=0?'up':'down'}">${s.changePct>=0?'+':''}${fmt(s.changePct)}%</span>`;
  $('selName').textContent = s.name + (s.rvol!=null ? ` · RVOL ${fmt(s.rvol,1)}x` : '');
  const est = liquidityEstimate(s, ses);
  $('liqLevel').textContent = est.lv; $('liqLevel').style.color = est.color;
  $('liqNote').textContent = est.note + (isOffHours(ses) ? t('offHours') : '');
  const pl = tradePlan(s);
  if(pl.valid){
    $('rkEntry').textContent = usd(pl.entry); $('rkStop').textContent = usd(pl.stopPx); $('rkTarget').textContent = usd(pl.target);
    $('rkSize').textContent = `$${Math.round(pl.pos)} (${t('plUnits',{u:fmt(pl.units,2)})})`;
    $('rkRiskLine').textContent = t('plRiskLine',{risk:fmt(pl.riskUsd,2), gain:fmt(pl.gainUsd,2)}) + (pl.capped ? ' ' + t('plCapped') : '');
  } else {
    ['rkEntry','rkStop','rkTarget','rkSize'].forEach(id => { $(id).textContent = '—'; });
    $('rkRiskLine').textContent = t('plInvalid');
  }
}

/* ---------------------------- 复制 Ticker ---------------------------- */
async function copySym(sym){
  if(!sym) return;
  try{ await navigator.clipboard.writeText(sym); }
  catch{ const ta=document.createElement('textarea'); ta.value=sym; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  toast(t('copied',{sym}));
}

/* =====================================================================
 *  模式切换 / Key 设置 / 语言切换 / 初始化
 * ===================================================================== */
function renderAll(){ applyRvol(); renderScan(); renderPicks(); renderSelected(); }

function renderMode(){
  $('modeSwitch').classList.toggle('live', state.live);
  $('modeMock').className = state.live ? 'mute' : 'font-bold';
  $('modeLive').className = state.live ? 'font-bold' : 'mute';
  $('modeLive').style.color = state.live ? '#f97316' : '';
  $('modeMock').style.color = state.live ? '' : '#4aa3ff';
}
function setMode(live){
  if(live && !getKey()){ toast(t('needKey'), 4500); $('keyBar').classList.remove('hidden'); return; }
  state.live = live; lsSet(LS.mode, live); renderMode();
  state.raw = []; state.scanTs = null; state.selected = null;
  if(live){
    const c = lsGet(LS.scan);                    // 真实模式：先展示上次缓存，不自动请求
    if(c && c.rows){ state.raw = c.rows; state.scanTs = c.ts; toast(t('loadedCache')); }
  } else {
    state.raw = MOCK_SCAN.map(r=>({...r})); state.scanTs = Date.now();
  }
  renderAll();
}

/* 应用语言：刷新所有静态文案 + 重新渲染动态内容 */
function applyLang(){
  document.documentElement.lang = LANG==='zh' ? 'zh-CN' : 'en';
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); });
  document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
  $('langSel').value = LANG;
  renderMode(); renderQuota(); renderAll();
}
function setLang(l){
  if(!I18N[l]) return;
  LANG = l; lsSet(LS.lang, l); applyLang();
}

$('langSel').onchange = e => setLang(e.target.value);
$('modeSwitch').onclick = () => setMode(!state.live);
$('btnRefresh').onclick = refreshScan;
$('btnCopy').onclick = () => copySym(state.selected?.symbol);
['fChg','fRvol','fMin','fMax'].forEach(id => $(id).addEventListener('input', () => { renderScan(); renderPicks(); }));
$('rvolAdj').onchange = () => { lsSet(LS.rvolAdj, $('rvolAdj').checked); renderAll(); };
['pCap','pRisk','pStop','pRR','pPull','pCost'].forEach(id => $(id).addEventListener('input', () => { saveRiskInputs(); renderPicks(); renderSelected(); }));
$('btnKey').onclick = () => { $('keyBar').classList.toggle('hidden'); $('keyInput').value = lsGet(LS.key) || ''; };
$('keySave').onclick = () => { lsSet(LS.key, $('keyInput').value.trim()); toast(t('keySaved')); $('keyBar').classList.add('hidden'); };
$('keyClear').onclick = () => { localStorage.removeItem(LS.key); $('keyInput').value=''; toast(t('keyCleared')); };

/* 初始化：不自动请求任何数据 */
loadRiskInputs();
$('rvolAdj').checked = lsGet(LS.rvolAdj, true) !== false;
if(state.live && !getKey()) state.live = false;
applyLang();
setMode(state.live);

/* PWA：注册 Service Worker（仅 https / localhost 生效） */
if('serviceWorker' in navigator){ window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
