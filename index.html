<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0e14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DayScan">
<title>DayScan · 美股日内交易扫描器</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root { --bg:#0b0e14; --panel:#11151d; --line:#1f2633; --txt:#d5dbe6; --mute:#7a8599; --up:#26d98b; --down:#ff5c6c; --acc:#4aa3ff; }
  html,body { background:var(--bg); color:var(--txt); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; }
  .up { color:var(--up); } .down { color:var(--down); } .mute { color:var(--mute); }
  .row { border-bottom:1px solid var(--line); cursor:pointer; transition:background .12s; }
  .row:hover { background:#161c28; }
  .row.active { background:#16243a; box-shadow: inset 3px 0 0 var(--acc); }
  .btn { border:1px solid var(--line); background:#161c28; border-radius:6px; padding:6px 12px; font-size:12px; transition:all .12s; }
  .btn:hover { border-color:var(--acc); color:#fff; }
  .btn-primary { background:#1b4a86; border-color:#2a6bc0; color:#fff; }
  .btn-primary:hover { background:#2260ad; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }
  select.btn { padding:5px 8px; cursor:pointer; color:var(--txt); }
  select.btn option { background:#11151d; color:#d5dbe6; }
  input[type=number], input[type=text], input[type=password] { background:#0b0e14; border:1px solid var(--line); border-radius:6px; padding:4px 8px; color:var(--txt); font-size:12px; width:100%; }
  .switch { position:relative; width:42px; height:22px; background:#2a3242; border-radius:999px; cursor:pointer; transition:.2s; flex:none; }
  .switch::after { content:""; position:absolute; top:3px; left:3px; width:16px; height:16px; background:#fff; border-radius:50%; transition:.2s; }
  .switch.live { background:#c2410c; } .switch.live::after { left:23px; }
  .badge { font-size:10px; padding:1px 6px; border-radius:4px; border:1px solid var(--line); }
  ::-webkit-scrollbar { width:8px; height:8px; } ::-webkit-scrollbar-thumb { background:#252d3d; border-radius:4px; }
  #toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:#1c2332; border:1px solid var(--line); padding:8px 16px; border-radius:8px; font-size:12px; opacity:0; pointer-events:none; transition:opacity .2s; z-index:50; max-width:90vw; }
  #toast.show { opacity:1; }
</style>
</head>
<body class="min-h-screen flex flex-col">

<!-- ===================== 头部 / Header ===================== -->
<header class="flex flex-wrap items-center gap-3 px-4 py-3 border-b" style="border-color:var(--line)">
  <div class="flex items-center gap-2">
    <span class="text-lg font-bold tracking-wider" style="color:var(--acc)">▌DAYSCAN</span>
    <span class="mute text-xs hidden sm:inline" data-i18n="sub"></span>
  </div>

  <div class="ml-auto flex flex-wrap items-center gap-3 text-xs">
    <!-- API 额度计数器 -->
    <div class="panel px-3 py-1.5 flex items-center gap-2" data-i18n-title="quotaTip">
      <span class="mute" data-i18n="quotaLabel"></span>
      <span id="quotaText" class="font-bold">0 / 250</span>
      <div class="w-20 h-1.5 rounded bg-[#222a39] overflow-hidden"><div id="quotaBar" class="h-full" style="width:0;background:var(--up)"></div></div>
      <span class="mute"><span data-i18n="quotaLeftLabel"></span> <b id="quotaLeft" class="text-white">250</b></span>
    </div>

    <!-- 语言切换 / Language -->
    <select id="langSel" class="btn" aria-label="Language / 语言">
      <option value="zh">🌐 中文</option>
      <option value="en">🌐 English</option>
    </select>

    <button id="btnKey" class="btn">🔑 API Key</button>

    <!-- 测试 / 真实 切换 -->
    <div class="flex items-center gap-2">
      <span id="modeMock" class="font-bold" data-i18n="modeMock"></span>
      <div id="modeSwitch" class="switch" role="switch" data-i18n-aria="modeAria"></div>
      <span id="modeLive" class="mute" data-i18n="modeLive"></span>
    </div>
  </div>
</header>

<!-- API Key 设置条 -->
<div id="keyBar" class="hidden px-4 py-3 border-b text-xs" style="border-color:var(--line);background:#0e121a">
  <div class="flex flex-wrap items-center gap-2 max-w-3xl">
    <span class="mute" data-i18n="keyHint"></span>
    <input id="keyInput" type="password" data-i18n-ph="keyPh" class="flex-1 min-w-[220px]" style="width:auto">
    <button id="keySave" class="btn btn-primary" data-i18n="save"></button>
    <button id="keyClear" class="btn" data-i18n="clear"></button>
  </div>
</div>

<!-- ===================== 主体 / Main ===================== -->
<main class="flex-1 grid gap-3 p-3 lg:grid-cols-[380px_1fr] min-h-0">

  <!-- 左：扫描面板 -->
  <section class="panel flex flex-col min-h-[420px] lg:h-[calc(100vh-120px)]">
    <div class="p-3 border-b" style="border-color:var(--line)">
      <div class="flex items-center justify-between mb-2">
        <h2 class="font-bold text-sm"><span data-i18n="scanTitle"></span> <span id="countBadge" class="badge mute">0</span></h2>
        <button id="btnRefresh" class="btn btn-primary" data-i18n="refresh"></button>
      </div>
      <div id="scanMeta" class="mute text-[11px] mb-2"></div>
      <div class="grid grid-cols-4 gap-2 text-[11px]">
        <label><span data-i18n="fChg"></span><input id="fChg" type="number" step="0.5" value="3"></label>
        <label><span data-i18n="fRvol"></span><input id="fRvol" type="number" step="0.1" value="2.0"></label>
        <label><span data-i18n="fMin"></span><input id="fMin" type="number" step="0.5" value="1"></label>
        <label><span data-i18n="fMax"></span><input id="fMax" type="number" step="1" value="50"></label>
      </div>
      <div class="mute text-[10px] mt-2" data-i18n="filterHint"></div>
    </div>
    <div id="scanList" class="flex-1 overflow-y-auto text-sm"></div>
    <div class="px-3 py-2 border-t mute text-[10px]" style="border-color:var(--line)" data-i18n="scanFoot"></div>
  </section>

  <!-- 右：图表与分析 -->
  <section class="flex flex-col gap-3 min-w-0">
    <div class="panel p-3">
      <div class="flex flex-wrap items-center gap-3">
        <div>
          <div class="flex items-baseline gap-3">
            <span id="selSym" class="text-2xl font-bold">—</span>
            <span id="selPrice" class="text-xl"></span>
            <span id="selChg" class="text-sm"></span>
          </div>
          <div id="selName" class="mute text-xs"></div>
        </div>
        <div class="ml-auto flex items-center gap-2 text-xs">
          <span id="candleMeta" class="mute"></span>
          <button id="btnReloadCandle" class="btn" disabled data-i18n="reloadCandle"></button>
        </div>
      </div>
      <div id="legend" class="mt-2 text-[11px] mute h-4"></div>
      <div class="relative">
        <div id="chart" class="w-full" style="height:430px"></div>
        <div id="chartEmpty" class="absolute inset-0 flex items-center justify-center mute text-sm text-center px-4"></div>
      </div>
    </div>

    <!-- eToro 风控卡片 -->
    <div class="panel p-4" id="riskCard">
      <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
        <h3 class="font-bold text-sm flex items-center gap-2">
          <span class="inline-block w-2 h-2 rounded-full" style="background:#7cc242"></span> <span data-i18n="riskTitle"></span>
        </h3>
        <div class="flex items-center gap-2">
          <span id="sessionBadge" class="badge"></span>
          <button id="btnCopy" class="btn" disabled data-i18n="copyBtn"></button>
        </div>
      </div>

      <div class="grid md:grid-cols-3 gap-3 text-xs">
        <div class="p-3 rounded-md" style="background:#0e121a;border:1px solid var(--line)">
          <div class="mute mb-1" data-i18n="liqTitle"></div>
          <div id="liqLevel" class="text-base font-bold">—</div>
          <div id="liqNote" class="mute mt-1 leading-relaxed"></div>
        </div>
        <div class="p-3 rounded-md" style="background:#0e121a;border:1px solid #6b4a12">
          <div class="mb-1" style="color:#f5a524" data-i18n="orderTitle"></div>
          <div class="font-bold text-sm" data-i18n="orderMain"></div>
          <div class="mute mt-1 leading-relaxed" data-i18n="orderDesc"></div>
        </div>
        <div class="p-3 rounded-md" style="background:#0e121a;border:1px solid var(--line)">
          <div class="mute mb-1" data-i18n="refTitle"></div>
          <div class="space-y-0.5">
            <div><span data-i18n="rkLastL"></span><b id="rkLast">—</b></div>
            <div><span data-i18n="rkVwapL"></span><b id="rkVwap">—</b></div>
            <div><span data-i18n="rkLimitL"></span><b id="rkLimit">—</b></div>
          </div>
          <div class="mute mt-1 text-[10px]" data-i18n="refNote"></div>
        </div>
      </div>

      <ul class="mute text-[11px] mt-3 space-y-1 list-disc pl-5">
        <li data-i18n="tip1"></li>
        <li data-i18n="tip2"></li>
        <li data-i18n="tip3"></li>
      </ul>
    </div>
  </section>
</main>

<div id="toast"></div>

function detectLang(){
  const saved = (()=>{ try { return JSON.parse(localStorage.getItem('dt_lang')); } catch { return null; } })();
  if(saved && I18N[saved]) return saved;
  return (navigator.language||'').toLowerCase().startsWith('zh') ? 'zh' : 'en';
}
let LANG = detectLang();
function t(key, vars){
  const s = (I18N[LANG] && I18N[LANG][key]) ?? I18N.zh[key] ?? key;
  return vars ? s.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? '') : s;
}
const locale = () => LANG==='zh' ? 'zh-CN' : 'en-US';

/* ---------------------------- 工具函数 ---------------------------- */
const $ = id => document.getElementById(id);
const fmt = (n, d=2) => (n==null||isNaN(n)) ? '—' : Number(n).toFixed(d);
const fmtVol = v => v==null ? '—' : v>=1e6 ? (v/1e6).toFixed(2)+'M' : v>=1e3 ? (v/1e3).toFixed(0)+'K' : String(v);
const lsGet = (k, def=null) => { try { const v = localStorage.getItem(k); return v==null?def:JSON.parse(v); } catch { return def; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
const utcDay = () => new Date().toISOString().slice(0,10);
function toast(msg, ms=3200){ const el=$('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.remove('show'), ms); }
function getKey(){ return (lsGet(LS.key) || (FMP_API_KEY==='YOUR_FMP_API_KEY' ? '' : FMP_API_KEY) || '').trim(); }

/* ---------------------------- 状态 ---------------------------- */
const state = {
  live: lsGet(LS.mode, false) === true,   // 默认 false = 测试模式
  raw: [],            // 扫描原始数据（未过滤）
  scanTs: null,
  selected: null,
  chart: null, candleSeries: null, vwapSeries: null, volSeries: null,
  bars: [], vwap: [],
  empty: { key:'chartHint' },   // 图表遮罩提示（可随语言重新渲染）
  candleInfo: null,            // { n, from, ts }
  riskLive: null               // { last, vwap }
};

/* ---------------------------- API 额度计数 ---------------------------- */
function quota(){ const q = lsGet(LS.quota, {day:utcDay(), used:0}); if(q.day!==utcDay()) return {day:utcDay(), used:0}; return q; }
function renderQuota(){
  const q = quota(), left = Math.max(0, DAILY_LIMIT - q.used), pct = Math.min(100, q.used/DAILY_LIMIT*100);
  $('quotaText').textContent = `${q.used} / ${DAILY_LIMIT}`;
  $('quotaLeft').textContent = left;
  const bar = $('quotaBar'); bar.style.width = pct+'%';
  bar.style.background = pct>85 ? 'var(--down)' : pct>60 ? '#f5a524' : 'var(--up)';
}
function addQuota(n=1){ const q = quota(); q.used += n; lsSet(LS.quota, q); renderQuota(); }

/* ---------------------------- FMP 请求封装 ---------------------------- */
async function fmp(path, params={}){
  const key = getKey();
  if(!key) throw new Error(t('errNoKey'));
  if(quota().used >= DAILY_LIMIT) throw new Error(t('errQuota'));
  const url = new URL(FMP_BASE + path);
  Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));
  url.searchParams.set('apikey', key);
  addQuota(1);                                   // 发出请求即计数
  const res = await fetch(url.toString());
  let data = null; try { data = await res.json(); } catch {}
  if(!res.ok){
    const msg = (data && (data['Error Message'] || data.message)) || res.statusText;
    throw new Error(`FMP ${res.status}: ${msg}`);
  }
  if(data && !Array.isArray(data) && (data['Error Message'] || data.message)) throw new Error(data['Error Message'] || data.message);
  return data;
}

/* =====================================================================
 *  模拟数据（Mock）
 * ===================================================================== */
function hashSeed(s){ let h=2166136261; for(const c of s){ h^=c.charCodeAt(0); h=Math.imul(h,16777619);} return h>>>0; }
function rng(seed){ let a=seed; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let x=Math.imul(a^a>>>15,1|a); x=x+Math.imul(x^x>>>7,61|x)^x; return ((x^x>>>14)>>>0)/4294967296; }; }

const MOCK_SCAN = [
  ['SMCX','Summit Micro Devices',4.82,18.4,1480000,210000],
  ['NVLA','Novella Therapeutics',12.35,9.7,5200000,1100000],
  ['AQTR','Aqtera Energy',2.14,7.1,9800000,3000000],
  ['BRZL','Brazil Lithium Corp',26.9,6.3,3900000,1500000],
  ['PXLS','Pixelstream Inc',8.77,5.2,2450000,900000],
  ['CRDO2','Cordova Robotics',38.2,4.6,1700000,820000],
  ['HLIO','Helio Solar',1.62,12.9,22000000,4000000],
  ['TMBR','Timber Holdings',45.1,3.4,1250000,600000],
  ['GXYZ','Galaxy Z Mobility',73.5,5.8,4100000,1200000],   // 价格超限 / price too high
  ['LOWV','LowVol Utilities',15.4,3.9,310000,280000],      // RVOL 不足 / RVOL too low
  ['FLAT','Flatline Corp',22.0,0.8,2600000,900000],        // 涨幅不足 / change too small
  ['PNNY','Penny Labs',0.62,25.0,31000000,2500000]         // 价格<1 / price < $1
].map(([symbol,name,price,chg,volume,avgVolume])=>({symbol,name,price,changePct:chg,volume,avgVolume,rvol:+(volume/avgVolume).toFixed(2)}));

function mockCandles(sym, lastPrice, changePct){
  const rand = rng(hashSeed(sym)), n = 78;
  const etDate = new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York'}).format(new Date());
  const start = Date.parse(etDate+'T09:30:00Z')/1000;     // 把 ET 时钟当作 UTC 展示
  const prevClose = lastPrice/(1+changePct/100);
  let p = prevClose*(1+changePct/100*0.35), walk=[];
  for(let i=0;i<n;i++){
    const drift = (changePct/100*0.65)/n;
    const o = p, c = o*(1+drift+(rand()-0.5)*0.012);
    const h = Math.max(o,c)*(1+rand()*0.006), l = Math.min(o,c)*(1-rand()*0.006);
    const v = Math.round((i<6?3:1)*(40000+rand()*90000)*(1+(rand()>0.9?3:0)));
    walk.push({o,h,l,c,v}); p=c;
  }
  const k = lastPrice / walk[n-1].c;
  return walk.map((b,i)=>({ time:start+i*300, open:+(b.o*k).toFixed(4), high:+(b.h*k).toFixed(4), low:+(b.l*k).toFixed(4), close:+(b.c*k).toFixed(4), volume:b.v }));
}

/* =====================================================================
 *  扫描数据加载
 * ===================================================================== */
const num = v => (v==null||v==='') ? null : Number(v);

async function loadScanLive(){
  // 请求1+2：涨幅榜 + 最活跃榜
  const [gainers, actives] = await Promise.all([ fmp('/biggest-gainers'), fmp('/most-actives') ]);
  const map = new Map();
  [...(gainers||[]), ...(actives||[])].forEach(r => {
    const sym = r.symbol; if(!sym || map.has(sym)) return;
    map.set(sym, { symbol:sym, name:r.name||'', price:num(r.price), changePct:num(r.changesPercentage ?? r.changePercentage), volume:null, avgVolume:null, rvol:null });
  });
  // 预过滤（价格&涨幅）后再取量能数据，减少 batch 请求规模
  const fMin=+$('fMin').value, fMax=+$('fMax').value, fChg=+$('fChg').value;
  let cands = [...map.values()].filter(r => r.price>=fMin && r.price<=fMax && r.changePct>fChg).slice(0,60);
  // 请求3：批量报价 → 取 volume / avgVolume 计算 RVOL
  if(cands.length){
    try{
      const q = await fmp('/batch-quote', { symbols: cands.map(c=>c.symbol).join(',') });
      const qm = new Map((q||[]).map(x=>[x.symbol,x]));
      cands.forEach(c => {
        const x = qm.get(c.symbol); if(!x) return;
        c.price = num(x.price) ?? c.price;
        c.changePct = num(x.changePercentage ?? x.changesPercentage) ?? c.changePct;
        c.volume = num(x.volume); c.avgVolume = num(x.avgVolume);
        if(c.volume && c.avgVolume) c.rvol = +(c.volume/c.avgVolume).toFixed(2);
      });
    }catch(e){
      toast(t('batchFail',{msg:e.message}), 6000);
    }
  }
  return cands;
}

async function refreshScan(){
  const btn = $('btnRefresh'); btn.disabled = true; btn.textContent = t('loading');
  try{
    if(state.live){
      if(!confirm(t('confirmRefresh',{used:quota().used, limit:DAILY_LIMIT}))) return;
      state.raw = await loadScanLive();
      state.scanTs = Date.now();
      lsSet(LS.scan, { ts:state.scanTs, rows:state.raw });
      toast(t('refreshed'));
    } else {
      await new Promise(r=>setTimeout(r,250));
      // 每次刷新在模拟数据上加一点随机扰动，便于调试 UI
      state.raw = MOCK_SCAN.map(r => { const j=1+(Math.random()-0.5)*0.01; return {...r, price:+(r.price*j).toFixed(2)}; });
      state.scanTs = Date.now();
      toast(t('mockToast'));
    }
  }catch(e){ toast(t('refreshFail',{msg:e.message}), 6000); }
  finally{ btn.disabled=false; btn.textContent=t('refresh'); renderScan(); }
}

/* ---------------------------- 渲染扫描列表 ---------------------------- */
function passFilter(r){
  const fChg=+$('fChg').value, fRvol=+$('fRvol').value, fMin=+$('fMin').value, fMax=+$('fMax').value;
  return r.price>=fMin && r.price<=fMax && r.changePct>fChg && (r.rvol==null || r.rvol>fRvol);
}
function renderScan(){
  const rows = state.raw.filter(passFilter).sort((a,b)=>b.changePct-a.changePct);
  $('countBadge').textContent = rows.length;
  const meta = $('scanMeta');
  if(state.scanTs){
    const mins = Math.round((Date.now()-state.scanTs)/60000);
    const tag = state.live ? `<span style="color:#f97316">● ${t('tagLive')}</span>` : `<span style="color:#4aa3ff">● ${t('tagMock')}</span>`;
    meta.innerHTML = t('scanMeta', {
      tag, time: new Date(state.scanTs).toLocaleTimeString(locale()),
      ago: mins<1 ? t('justNow') : t('minsAgo',{m:mins}), n: state.raw.length
    });
  } else meta.textContent = t('notLoaded');
  const list = $('scanList');
  if(!rows.length){ list.innerHTML = `<div class="p-6 text-center mute text-xs">${state.raw.length ? t('noMatch') : t('noData')}</div>`; return; }
  list.innerHTML = rows.map(r => `
    <div class="row px-3 py-2.5 ${state.selected?.symbol===r.symbol?'active':''}" data-sym="${r.symbol}">
      <div class="flex items-center justify-between">
        <span class="font-bold">${r.symbol}</span>
        <span class="up font-bold">+${fmt(r.changePct)}%</span>
      </div>
      <div class="flex items-center justify-between text-[11px] mute mt-0.5">
        <span class="truncate max-w-[160px]">${r.name||''}</span>
        <span>$${fmt(r.price)}</span>
      </div>
      <div class="flex items-center gap-2 text-[11px] mt-1">
        <span class="badge ${r.rvol==null?'mute':'up'}">RVOL ${r.rvol==null?t('rvolNA'):fmt(r.rvol,1)+'x'}</span>
        <span class="mute">Vol ${fmtVol(r.volume)}</span>
      </div>
    </div>`).join('');
  list.querySelectorAll('.row').forEach(el => el.onclick = () => selectStock(el.dataset.sym));
}

function setEmpty(key, vars){ state.empty = key ? { key, vars } : null; renderChartEmpty(); }
function renderChartEmpty(){
  const el = $('chartEmpty');
  if(state.empty){ el.textContent = t(state.empty.key, state.empty.vars); el.style.display = 'flex'; }
  else el.style.display = 'none';
}
function renderCandleMeta(){
  const ci = state.candleInfo, el = $('candleMeta');
  if(!ci){ el.textContent = ''; return; }
  const src = ci.from==='mock' ? t('srcMock') : ci.from==='cache' ? t('srcCache',{m:Math.round((Date.now()-ci.ts)/60000)}) : t('srcApi');
  el.textContent = t('candleMeta',{n:ci.n, src});
}

function ensureChart(){
  if(state.chart) return;
  const el = $('chart');
  state.chart = LightweightCharts.createChart(el, {
    layout:{ background:{type:'solid',color:'#11151d'}, textColor:'#9aa4b8', fontFamily:'ui-monospace, monospace' },
    grid:{ vertLines:{color:'#1a2130'}, horzLines:{color:'#1a2130'} },
    crosshair:{ mode:0 },
    rightPriceScale:{ borderColor:'#1f2633' },
    timeScale:{ borderColor:'#1f2633', timeVisible:true, secondsVisible:false },
    width: el.clientWidth, height: 430
  });
  state.candleSeries = state.chart.addCandlestickSeries({ upColor:'#26d98b', downColor:'#ff5c6c', borderVisible:false, wickUpColor:'#26d98b', wickDownColor:'#ff5c6c' });
  state.vwapSeries = state.chart.addLineSeries({ color:'#f5a524', lineWidth:2, priceLineVisible:false, lastValueVisible:true, title:'VWAP' });
  state.volSeries = state.chart.addHistogramSeries({ priceFormat:{type:'volume'}, priceScaleId:'vol' });
  state.chart.priceScale('vol').applyOptions({ scaleMargins:{ top:0.82, bottom:0 } });
  state.chart.subscribeCrosshairMove(p => {
    const c = p.seriesData && p.seriesData.get(state.candleSeries), v = p.seriesData && p.seriesData.get(state.vwapSeries);
    $('legend').innerHTML = c ? `O ${fmt(c.open)} H ${fmt(c.high)} L ${fmt(c.low)} C ${fmt(c.close)} ${v?` · <span style="color:#f5a524">VWAP ${fmt(v.value)}</span>`:''}` : '';
  });
  new ResizeObserver(()=> state.chart.applyOptions({ width: el.clientWidth })).observe(el);
}

function parseFmpBars(rows){
  // FMP 返回倒序、含多日；取最新交易日并转升序。时间字符串为美东时间，按 UTC 渲染以便图上显示 ET 时钟
  if(!rows || !rows.length) return [];
  const latest = rows[0].date.slice(0,10);
  return rows.filter(r => r.date.startsWith(latest)).reverse().map(r => ({
    time: Date.parse(r.date.replace(' ','T')+'Z')/1000,
    open:+r.open, high:+r.high, low:+r.low, close:+r.close, volume:+r.volume
  }));
}

function calcVWAP(bars){
  let pv=0, vv=0;
  return bars.map(b => { const tp=(b.high+b.low+b.close)/3; pv+=tp*b.volume; vv+=b.volume; return { time:b.time, value: vv? +(pv/vv).toFixed(4) : b.close }; });
}

async function getCandles(sym, force=false){
  const stock = state.raw.find(r=>r.symbol===sym);
  if(!state.live) return { bars: mockCandles(sym, stock.price, stock.changePct), from:'mock' };
  const ck = LS.candle+sym, cached = lsGet(ck);
  if(!force && cached && Date.now()-cached.ts < CANDLE_TTL_MS) return { bars:cached.bars, from:'cache', ts:cached.ts };
  const rows = await fmp('/historical-chart/5min', { symbol:sym });    // 1 次请求
  const bars = parseFmpBars(rows);
  lsSet(ck, { ts:Date.now(), bars });
  return { bars, from:'api', ts:Date.now() };
}

async function selectStock(sym, force=false){
  const stock = state.raw.find(r=>r.symbol===sym); if(!stock) return;
  state.selected = stock; state.riskLive = null; state.candleInfo = null;
  renderScan(); renderHeader(stock); updateRisk(stock, null); renderCandleMeta();
  setEmpty('chartLoading');
  $('btnCopy').disabled = false; $('btnReloadCandle').disabled = false;
  try{
    const { bars, from, ts } = await getCandles(sym, force);
    if(state.selected?.symbol !== sym) return;           // 用户已切换
    if(!bars.length) throw new Error(t('noBars'));
    ensureChart();
    state.bars = bars; state.vwap = calcVWAP(bars);
    state.candleSeries.setData(bars.map(({time,open,high,low,close})=>({time,open,high,low,close})));
    state.vwapSeries.setData(state.vwap);
    state.volSeries.setData(bars.map(b=>({ time:b.time, value:b.volume, color: b.close>=b.open ? 'rgba(38,217,139,.35)' : 'rgba(255,92,108,.35)' })));
    state.chart.timeScale().fitContent();
    setEmpty(null);
    state.candleInfo = { n:bars.length, from, ts };
    renderCandleMeta();
    state.riskLive = { last: bars[bars.length-1].close, vwap: state.vwap[state.vwap.length-1].value };
    updateRisk(stock, state.riskLive);
  }catch(e){
    setEmpty('chartFail', {msg:e.message});
    toast(t('candleFail',{msg:e.message}), 6000);
  }
}

function renderHeader(s){
  $('selSym').textContent = s.symbol;
  $('selPrice').textContent = '$'+fmt(s.price);
  $('selChg').innerHTML = `<span class="${s.changePct>=0?'up':'down'}">${s.changePct>=0?'+':''}${fmt(s.changePct)}%</span>`;
  $('selName').textContent = s.name + (s.rvol!=null ? ` · RVOL ${fmt(s.rvol,1)}x` : '');
}

/* =====================================================================
 *  eToro 风控卡片
 * ===================================================================== */
function etSession(){
  const p = new Intl.DateTimeFormat('en-US',{ timeZone:'America/New_York', weekday:'short', hour:'2-digit', minute:'2-digit', hour12:false }).formatToParts(new Date());
  const g = ty => p.find(x=>x.type===ty).value, wd=g('weekday'), m = (+g('hour')%24)*60 + +g('minute');
  if(wd==='Sat'||wd==='Sun') return { key:'closed', label:t('sessWeekend'), color:'#7a8599' };
  if(m>=240 && m<570)  return { key:'pre',    label:t('sessPre'),     color:'#f5a524' };
  if(m>=570 && m<585)  return { key:'open',   label:t('sessOpen'),    color:'#ff8a3d' };
  if(m>=585 && m<960)  return { key:'regular',label:t('sessRegular'), color:'#26d98b' };
  if(m>=960 && m<1200) return { key:'after',  label:t('sessAfter'),   color:'#f5a524' };
  return { key:'closed', label:t('sessClosed'), color:'#7a8599' };
}
function renderSession(){
  const ses = etSession(), sb = $('sessionBadge');
  sb.textContent = ses.label; sb.style.color = ses.color; sb.style.borderColor = ses.color;
  return ses;
}

function liquidityEstimate(s, ses){
  // 经验性启发式：低价股、低成交量、非常规时段 → 点差更大。并非真实报价点差。
  let score = 0;
  if(s.price < 3) score += 2; else if(s.price < 10) score += 1;
  if(s.volume != null){ if(s.volume < 500000) score += 2; else if(s.volume < 2000000) score += 1; }
  if(s.rvol != null && s.rvol > 8) score += 1;                     // 极端放量常伴随点差剧烈波动
  if(Math.abs(s.changePct) > 15) score += 1;
  if(['pre','after','open'].includes(ses.key)) score += 2;
  if(ses.key==='closed') score += 1;
  if(score >= 5) return { lv:t('liqBad'),  color:'var(--down)', note:t('liqBadNote') };
  if(score >= 3) return { lv:t('liqMid'),  color:'#f5a524',     note:t('liqMidNote') };
  return               { lv:t('liqGood'), color:'var(--up)',   note:t('liqGoodNote') };
}

function updateRisk(s, live){
  const ses = renderSession();
  if(!s) return;
  const est = liquidityEstimate(s, ses);
  $('liqLevel').textContent = est.lv; $('liqLevel').style.color = est.color;
  $('liqNote').textContent = est.note + (['pre','after','open'].includes(ses.key) ? t('offHours') : '');
  const last = live?.last ?? s.price, vwap = live?.vwap;
  $('rkLast').textContent = '$'+fmt(last);
  $('rkVwap').textContent = vwap!=null ? '$'+fmt(vwap) : t('rkVwapNone');
  if(vwap!=null){
    const lo = Math.min(last, vwap), hi = Math.max(last, vwap);
    $('rkLimit').textContent = Math.abs(hi-lo)/last < 0.002 ? `≈ $${fmt(last)}` : `$${fmt(lo)} – $${fmt(hi)}`;
  } else $('rkLimit').textContent = '—';
}

/* ---------------------------- 复制 Ticker ---------------------------- */
async function copyTicker(){
  if(!state.selected) return;
  const sym = state.selected.symbol;
  try{ await navigator.clipboard.writeText(sym); }
  catch{ const ta=document.createElement('textarea'); ta.value=sym; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  toast(t('copied',{sym}));
}

 *  模式切换 / Key 设置 / 语言切换 / 初始化

function renderMode(){
  $('modeSwitch').classList.toggle('live', state.live);
  $('modeMock').className = state.live ? 'mute' : 'font-bold';
  $('modeLive').className = state.live ? 'font-bold' : 'mute';
  $('modeLive').style.color = state.live ? '#f97316' : '';
  $('modeMock').style.color = state.live ? '' : '#4aa3ff';
}
function setMode(live){
  if(live && !getKey()){ toast(t('needKey'), 4500); $('keyBar').classList.remove('hidden'); return; }
  state.live = live; lsSet(LS.mode, live); renderMode();
  state.raw = []; state.scanTs = null; state.selected = null; state.riskLive = null; state.candleInfo = null;
  $('selSym').textContent='—'; $('selPrice').textContent=''; $('selChg').textContent=''; $('selName').textContent='';
  $('btnCopy').disabled = true; $('btnReloadCandle').disabled = true;
  ['liqLevel','rkLast','rkVwap','rkLimit'].forEach(id => { $(id).textContent='—'; }); $('liqNote').textContent='';
  if(state.candleSeries){ state.candleSeries.setData([]); state.vwapSeries.setData([]); state.volSeries.setData([]); }
  setEmpty('chartHint'); renderCandleMeta();
  if(live){
    const c = lsGet(LS.scan);                    // 真实模式：先展示上次缓存，不自动请求
    if(c && c.rows){ state.raw = c.rows; state.scanTs = c.ts; toast(t('loadedCache')); }
  } else {
    state.raw = MOCK_SCAN.map(r=>({...r})); state.scanTs = Date.now();
  }
  renderScan(); renderSession();
}

/* 应用语言：刷新所有静态文案 + 重新渲染动态内容 */
function applyLang(){
  document.documentElement.lang = LANG==='zh' ? 'zh-CN' : 'en';
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); });
  document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
  $('langSel').value = LANG;
  renderMode(); renderQuota(); renderScan(); renderChartEmpty(); renderCandleMeta();
  if(state.selected){ renderHeader(state.selected); updateRisk(state.selected, state.riskLive); } else renderSession();
}
function setLang(l){
  if(!I18N[l]) return;
  LANG = l; lsSet(LS.lang, l); applyLang();
}

$('langSel').onchange = e => setLang(e.target.value);
$('modeSwitch').onclick = () => setMode(!state.live);
$('btnRefresh').onclick = refreshScan;
$('btnCopy').onclick = copyTicker;
$('btnReloadCandle').onclick = () => {
  if(!state.selected) return;
  if(state.live && !confirm(t('confirmReload'))) return;

};
['fChg','fRvol','fMin','fMax'].forEach(id => $(id).addEventListener('input', renderScan));
$('btnKey').onclick = () => { $('keyBar').classList.toggle('hidden'); $('keyInput').value = lsGet(LS.key) || ''; };

$('keyClear').onclick = () => { localStorage.removeItem(LS.key); $('keyInput').value=''; toast(t('keyCleared')); };

if(state.live && !getKey()) state.live = false;
applyLang();
setMode(state.live);

if('serviceWorker' in navigator){ window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{})); }
