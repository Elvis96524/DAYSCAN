<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c0a1f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DayScan">
<title>DayScan · 美股日内交易扫描器</title>
<style>
  :root{
    --ink:#0c0a1f; --surface:#14112c; --raised:#1c1840;
    --line:rgba(160,150,255,.14); --line2:rgba(160,150,255,.3);
    --text:#ecebff; --muted:#a09dc8;
    --violet:#8b5cf6; --sky:#38bdf8; --mint:#34e0a1; --coral:#ff6b7a; --amber:#ffb547; --pink:#f472b6;
    --r:18px; --r2:12px;
  }
  *{box-sizing:border-box}
  html{background:var(--ink); color-scheme:dark}
  body{
    margin:0; min-height:100vh; color:var(--text);
    font:14px/1.45 system-ui,-apple-system,"Segoe UI","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Roboto,sans-serif;
    font-variant-numeric:tabular-nums; -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:
      radial-gradient(60rem 38rem at 6% -12%, rgba(139,92,246,.38), transparent 60%),
      radial-gradient(50rem 34rem at 104% -4%, rgba(56,189,248,.24), transparent 58%),
      radial-gradient(46rem 30rem at 62% 112%, rgba(244,114,182,.2), transparent 58%);
  }
  .hidden{display:none!important}
  .muted{color:var(--muted)}
  :focus-visible{outline:2px solid var(--sky); outline-offset:2px}
  ::-webkit-scrollbar{width:8px;height:8px} ::-webkit-scrollbar-thumb{background:rgba(160,150,255,.25);border-radius:8px}

  .topbar{
    position:sticky; top:0; z-index:30; display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px;
    padding:12px 20px; background:rgba(12,10,31,.72); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:12px}
  .mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--violet),var(--sky) 60%,var(--mint)); box-shadow:0 6px 20px -6px rgba(139,92,246,.7)}
  .brand h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
  .brand small{display:block;color:var(--muted);font-size:11.5px}
  .tools{margin-left:auto; display:flex; flex-wrap:wrap; align-items:center; gap:10px}
  .quota{display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:999px;background:rgba(160,150,255,.1);border:1px solid var(--line);font-size:12px}
  .quota .bar{width:64px;height:6px;border-radius:99px;background:rgba(160,150,255,.2);overflow:hidden}
  .quota .bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--mint),var(--sky));transition:width .4s}
  .quota b{color:#fff}

  .btn{font:inherit;font-size:12.5px;font-weight:600;color:var(--text);cursor:pointer;padding:8px 14px;border-radius:999px;
    background:rgba(160,150,255,.12);border:1px solid var(--line);transition:background .15s,border-color .15s,transform .1s}
  .btn:hover{background:rgba(160,150,255,.2);border-color:var(--line2)}
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
  .btn-primary{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--violet),#5b8def 60%,var(--sky));box-shadow:0 8px 22px -10px rgba(139,92,246,.9)}
  .btn-primary:hover{background:linear-gradient(135deg,#9b72f8,#6c9cf5 60%,#52c7f5)}
  .btn-sm{padding:3px 9px;font-size:12px}
  select.btn{appearance:none;-webkit-appearance:none;padding-right:14px}
  select.btn option{background:#14112c;color:#ecebff}
  input[type=number],input[type=password]{
    width:100%;height:38px;padding:0 12px;font:inherit;font-size:13px;color:var(--text);
    background:rgba(8,6,24,.6);border:1px solid var(--line);border-radius:10px;transition:border-color .15s,box-shadow .15s}
  input[type=number]:focus,input[type=password]:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 3px rgba(56,189,248,.2)}
  input[type=checkbox]{accent-color:var(--violet);width:16px;height:16px;flex:none}
  .field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
  .check{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);cursor:pointer}

  .seg2{display:inline-flex;padding:3px;border-radius:999px;background:rgba(160,150,255,.12);border:1px solid var(--line);cursor:pointer;user-select:none}
  .seg2 span{padding:6px 13px;border-radius:999px;font-size:12px;font-weight:700;color:var(--muted);transition:background .2s,color .2s}
  .seg2 span.on.test{background:linear-gradient(135deg,var(--sky),var(--violet));color:#fff}
  .seg2 span.on.liv{background:linear-gradient(135deg,var(--amber),var(--coral));color:#1c1030}

  .keybar{padding:12px 20px;background:rgba(20,17,44,.9);border-bottom:1px solid var(--line);font-size:12px}
  .keybar .in{display:flex;flex-wrap:wrap;align-items:center;gap:10px;max-width:880px}
  .keybar input{flex:1;min-width:220px;width:auto}

  .wrap{max-width:1280px;margin:0 auto;padding:16px 16px 48px;display:flex;flex-direction:column;gap:16px}
  .layout{display:grid;grid-template-columns:minmax(340px,410px) 1fr;gap:16px;align-items:start}
  .stack{display:flex;flex-direction:column;gap:16px;min-width:0}
  .card{background:linear-gradient(180deg,rgba(30,26,68,.82),rgba(20,17,44,.82));border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .card-pad{padding:18px}
  .card-title{display:flex;align-items:center;gap:10px;margin:0;font-size:16px;font-weight:750;letter-spacing:-.01em}
  .count{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:rgba(139,92,246,.22);color:#cdbbff}

  .strip{padding:16px 20px 12px}
  .strip-top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 18px;margin-bottom:30px}
  .strip-title{display:flex;align-items:center;gap:10px;font-size:16px}
  .strip-title b{font-weight:750}
  .live-dot{width:10px;height:10px;border-radius:50%;background:var(--dot,var(--muted));box-shadow:0 0 14px 1px var(--dot,transparent)}
  .strip-note{font-size:12.5px}
  .strip-track{position:relative;height:20px}
  .strip-bar{display:flex;gap:3px;height:20px}
  .seg{display:block;position:relative;border-radius:999px;overflow:hidden;opacity:.34;transition:opacity .3s}
  .seg.cur{opacity:1}
  .seg em{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:750;color:#1a1030}
  .seg-pre{background:linear-gradient(90deg,#ffb547,#ff9a5c)}
  .seg-open{background:var(--coral)}
  .seg-regular{background:linear-gradient(90deg,var(--mint),var(--sky))}
  .seg-after{background:linear-gradient(90deg,#ff9a5c,var(--pink))}
  .strip-now{position:absolute;top:50%;left:var(--p,0%);width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:#fff;
    box-shadow:0 0 0 5px rgba(255,255,255,.18),0 6px 18px rgba(0,0,0,.55);transition:left 1.1s cubic-bezier(.2,.8,.2,1)}
  .strip-now.off{display:none}
  .strip-now span{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);padding:3px 9px;border-radius:9px;background:#fff;color:#150f33;font-size:11.5px;font-weight:750;white-space:nowrap}
  .strip-now.edge-l span{left:0;transform:none}
  .strip-now.edge-r span{left:auto;right:0;transform:none}
  .strip-ticks{position:relative;height:20px;margin-top:8px;font-size:11.5px;color:var(--muted)}
  .strip-ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
  .strip-ticks span:first-child{transform:none}
  .strip-ticks span:last-child{transform:translateX(-100%)}

  .scan{position:sticky;top:84px;display:flex;flex-direction:column;max-height:calc(100vh - 100px);overflow:hidden}
  .scan-head{padding:18px 18px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
  .scan-head .line{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .meta{font-size:12px;line-height:1.5;color:var(--muted)}
  .tag-live{color:var(--amber);font-weight:700} .tag-mock{color:var(--sky);font-weight:700}
  .warn-txt{color:var(--amber)}
  .filters{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 12px}
  .scan-list{flex:1;overflow-y:auto;min-height:180px;padding:8px}
  .scan-foot{padding:10px 18px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
  .empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:13px}

  .row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;
    padding:10px 12px;margin:0 0 4px;border-radius:14px;border:1px solid transparent;background:transparent;transition:background .15s,border-color .15s}
  .row:hover{background:rgba(160,150,255,.09)}
  .row.active{background:linear-gradient(90deg,rgba(139,92,246,.26),rgba(56,189,248,.1));border-color:rgba(139,92,246,.5)}
  .avatar{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none;font-weight:800;font-size:13px;color:#140f30;
    background:linear-gradient(135deg,hsl(var(--h,260) 85% 68%),hsl(calc(var(--h,260) + 45) 85% 60%))}
  .row-main{display:flex;flex-direction:column;gap:2px;min-width:0}
  .sym{font-size:15px;font-weight:800;letter-spacing:.01em}
  .nm{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row-chips{display:flex;align-items:center;gap:8px;margin-top:3px;font-size:11.5px}
  .row-side{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
  .px{font-size:15px;font-weight:700}
  .pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
  .pill-up{color:var(--mint);background:rgba(52,224,161,.14)}
  .pill-down{color:var(--coral);background:rgba(255,107,122,.15)}
  .pill-warn{color:var(--amber);background:rgba(255,181,71,.15)}
  .pill-bad{color:var(--coral);background:rgba(255,107,122,.12)}
  .pill-mute{color:var(--muted);background:rgba(160,150,255,.12)}

  .picks-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
  .picks-head .right{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted)}
  .hint{margin:10px 0 0;font-size:12px;color:var(--amber)}
  .hint:empty{display:none}
  .params{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px 12px;margin:16px 0}
  .picks-list{display:flex;flex-direction:column;gap:12px}
  .disclaimer{margin:14px 0 0;font-size:11.5px;line-height:1.55;color:var(--muted)}

  .pick{position:relative;padding:14px 16px 14px 20px;border-radius:var(--r2);cursor:pointer;border:1px solid var(--line);
    background:rgba(10,8,28,.5);transition:border-color .15s,background .15s}
  .pick::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--gc,var(--violet))}
  .pick:hover{border-color:var(--line2)}
  .pick.sel{background:rgba(30,26,68,.75);border-color:var(--gc);box-shadow:0 14px 34px -18px var(--gc)}
  .pick-head{display:flex;align-items:center;gap:12px}
  .rank{width:20px;text-align:center;font-weight:800;color:var(--muted);font-size:13px}
  .pick-id{display:flex;flex-direction:column;min-width:0;flex:1}
  .pick-id b{font-size:16px;font-weight:800}
  .pick-px{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  .ring{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;
    background:conic-gradient(var(--c,var(--violet)) calc(var(--p,0)*1%),rgba(160,150,255,.16) 0)}
  .ring span{width:37px;height:37px;border-radius:50%;display:grid;place-items:center;background:#16132f;font-size:13.5px;font-weight:800}
  .pick-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:12px}
  .chip,.grade{position:relative;isolation:isolate;display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;color:var(--cc,var(--muted))}
  .chip::before,.grade::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--cc);opacity:.14;z-index:-1}
  .chip::after,.grade::after{content:"";position:absolute;inset:0;border-radius:inherit;border:1px solid var(--cc);opacity:.4;z-index:-1}
  .grade{font-weight:800;padding:2px 11px}
  .plan{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px;margin-top:12px}
  .tile{border-radius:12px;padding:9px 11px;border:1px solid transparent}
  .tile small{display:block;font-size:11.5px;color:var(--muted);margin-bottom:2px}
  .tile b{font-size:15.5px;font-weight:800}
  .t-entry{background:rgba(56,189,248,.12);border-color:rgba(56,189,248,.3)} .t-entry b{color:#7fd6fb}
  .t-stop{background:rgba(255,107,122,.12);border-color:rgba(255,107,122,.3)} .t-stop b{color:#ff98a2}
  .t-target{background:rgba(52,224,161,.12);border-color:rgba(52,224,161,.3)} .t-target b{color:#6fe9bd}
  .t-size{background:rgba(139,92,246,.16);border-color:rgba(139,92,246,.38)} .t-size b{color:#c3adff}
  .plan-note{margin:8px 0 0;font-size:11.5px;color:var(--muted)}

  .risk{position:relative;padding:20px;border-radius:var(--r);border:1px solid transparent;
    background:linear-gradient(180deg,#1d1942,#14112c) padding-box,
               linear-gradient(135deg,rgba(139,92,246,.7),rgba(56,189,248,.45) 50%,rgba(52,224,161,.5)) border-box}
  .sel-head{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
  .sel-id{display:flex;align-items:baseline;flex-wrap:wrap;gap:6px 14px}
  .sel-sym{font-size:30px;font-weight:850;letter-spacing:-.02em;line-height:1}
  .sel-px{font-size:22px;font-weight:700}
  .sel-name{margin-top:4px;font-size:12.5px;color:var(--muted)}
  .sel-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
  .sess-badge{font-size:11.5px;font-weight:700;padding:3px 11px;border-radius:999px;border:1px solid currentColor}
  .sess-badge:empty{display:none}
  .risk h3{margin:20px 0 12px;font-size:14px;font-weight:750;display:flex;align-items:center;gap:8px}
  .risk h3 i{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--mint),var(--sky))}
  .info{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .box{padding:14px 15px;border-radius:14px;background:rgba(8,6,24,.5);border:1px solid var(--line);font-size:12.5px}
  .box.warn{background:rgba(255,181,71,.07);border-color:rgba(255,181,71,.38)}
  .box .ttl{color:var(--muted);margin-bottom:6px;font-size:12px}
  .box.warn .ttl{color:var(--amber);font-weight:700}
  .box .big{font-size:15.5px;font-weight:800}
  .box .note{margin-top:6px;line-height:1.55;color:var(--muted)}
  .meter{display:flex;gap:4px;margin:8px 0 6px}
  .meter i{flex:1;height:6px;border-radius:99px;background:rgba(160,150,255,.18)}
  .meter[data-lvl=good] i:nth-child(1){background:var(--mint)}
  .meter[data-lvl=mid] i:nth-child(-n+2){background:var(--amber)}
  .meter[data-lvl=bad] i{background:var(--coral)}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
  .kv b{font-weight:800}
  .kv .c-entry{color:#7fd6fb} .kv .c-stop{color:#ff98a2} .kv .c-target{color:#6fe9bd} .kv .c-size{color:#c3adff}
  .tips{margin:16px 0 0;padding-left:18px;color:var(--muted);font-size:12px;line-height:1.6}

  #toast{position:fixed;left:50%;bottom:20px;z-index:60;max-width:min(92vw,560px);padding:11px 18px;border-radius:14px;font-size:13px;line-height:1.45;
    background:rgba(34,29,76,.96);border:1px solid var(--line2);box-shadow:0 18px 40px -12px rgba(0,0,0,.6);
    opacity:0;transform:translate(-50%,10px);pointer-events:none;transition:opacity .2s,transform .2s}
  #toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:1023px){
    .layout{grid-template-columns:1fr}
    .scan{position:static;max-height:none}
    .scan-list{max-height:62vh}
    .topbar{padding:10px 14px}
    .tools{margin-left:0;width:100%}
    .wrap{padding:12px 12px 40px}
  }
  @media (max-width:520px){
    .brand small{display:none}
    .sel-sym{font-size:26px}
    .strip{padding:14px 14px 10px}
    .quota .bar{display:none}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="22" height="22" fill="none"><g stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M9 7v18M16 4v20M23 9v17"/></g><g fill="#fff"><rect x="6.5" y="12" width="5" height="9" rx="1.2"/><rect x="13.5" y="9" width="5" height="9" rx="1.2" opacity=".78"/><rect x="20.5" y="14" width="5" height="8" rx="1.2"/></g></svg>
    </span>
    <div>
      <h1>DayScan</h1>
      <small data-i18n="sub"></small>
    </div>
  </div>

  <div class="tools">
    <div class="quota" data-i18n-title="quotaTip">
      <span class="muted" data-i18n="quotaLabel"></span>
      <b id="quotaText">0 / 250</b>
      <span class="bar"><i id="quotaBar"></i></span>
      <span class="muted"><span data-i18n="quotaLeftLabel"></span> <b id="quotaLeft">250</b></span>
    </div>
    <select id="langSel" class="btn" aria-label="Language / 语言">
      <option value="zh">🌐 中文</option>
      <option value="en">🌐 English</option>
    </select>
    <button id="btnKey" class="btn" type="button">🔑 API Key</button>
    <div id="modeSwitch" class="seg2" role="switch" tabindex="0" aria-checked="false" data-i18n-aria="modeAria">
      <span id="modeMock" class="test on" data-i18n="modeMock"></span>
      <span id="modeLive" class="liv" data-i18n="modeLive"></span>
    </div>
  </div>
</header>

<div id="keyBar" class="keybar hidden">
  <div class="in">
    <span class="muted" data-i18n="keyHint"></span>
    <input id="keyInput" type="password" data-i18n-ph="keyPh" autocomplete="off">
    <button id="keySave" class="btn btn-primary" type="button" data-i18n="save"></button>
    <button id="keyClear" class="btn" type="button" data-i18n="clear"></button>
  </div>
</div>

<main class="wrap">

  <section class="card strip" aria-label="Market session">
    <div class="strip-top">
      <div class="strip-title"><span class="live-dot" id="sessDot"></span><b id="sessLabel">—</b><span class="muted" id="sessClock"></span></div>
      <div class="strip-note muted" id="sessNote"></div>
    </div>
    <div class="strip-track" id="sessTrack" role="img">
      <div class="strip-bar" id="sessBar"></div>
      <div class="strip-now off" id="sessNow"><span id="sessNowTime"></span></div>
    </div>
    <div class="strip-ticks" id="sessTicks"></div>
  </section>

  <div class="layout">

    <section class="card scan">
      <div class="scan-head">
        <div class="line">
          <h2 class="card-title"><span data-i18n="scanTitle"></span> <span id="countBadge" class="count">0</span></h2>
          <button id="btnRefresh" class="btn btn-primary" type="button" data-i18n="refresh"></button>
        </div>
        <div id="scanMeta" class="meta"></div>
        <div class="filters">
          <label class="field"><span data-i18n="fChg"></span><input id="fChg" type="number" step="0.5" value="3"></label>
          <label class="field"><span data-i18n="fRvol"></span><input id="fRvol" type="number" step="0.1" value="2.0"></label>
          <label class="field"><span data-i18n="fMin"></span><input id="fMin" type="number" step="0.5" value="1"></label>
          <label class="field"><span data-i18n="fMax"></span><input id="fMax" type="number" step="1" value="50"></label>
        </div>

function detectLang(){
  const saved = (()=>{ try { return JSON.parse(localStorage.getItem('dt_lang')); } catch { return null; } })();
  if(saved && I18N[saved]) return saved;
  return (navigator.language||'').toLowerCase().startsWith('zh') ? 'zh' : 'en';
}
let LANG = detectLang();
function t(key, vars){
  const s = (I18N[LANG] && I18N[LANG][key]) ?? I18N.zh[key] ?? key;
  return vars ? s.replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? '') : s;
}

/* ---------------------------- API 额度计数 ---------------------------- */
function quota(){ const q = lsGet(LS.quota, {day:utcDay(), used:0}); if(q.day!==utcDay()) return {day:utcDay(), used:0}; return q; }
function renderQuota(){
  const q = quota(), left = Math.max(0, DAILY_LIMIT - q.used), pct = Math.min(100, q.used/DAILY_LIMIT*100);
  $('quotaText').textContent = `${q.used} / ${DAILY_LIMIT}`;
  $('quotaLeft').textContent = left;
  const bar = $('quotaBar'); bar.style.width = pct+'%';
  bar.style.background = pct>85 ? 'var(--coral)' : pct>60 ? 'var(--amber)' : 'linear-gradient(90deg,var(--mint),var(--sky))';
}
function addQuota(n=1){ const q = quota(); q.used += n; lsSet(LS.quota, q); renderQuota(); }

/* ---------------------------- FMP 请求封装 ---------------------------- */
async function fmp(path, params={}){
  const key = getKey();
  if(!key) throw new Error(t('errNoKey'));
  if(quota().used >= DAILY_LIMIT) throw new Error(t('errQuota'));
  const url = new URL(FMP_BASE + path);
  Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, v));
  url.searchParams.set('apikey', key);
  addQuota(1);                                   // 发出请求即计数
  const res = await fetch(url.toString());
  let data = null; try { data = await res.json(); } catch {}
  if(!res.ok){
    const msg = (data && (data['Error Message'] || data.message)) || res.statusText;
    throw new Error(`FMP ${res.status}: ${msg}`);
  }
  if(data && !Array.isArray(data) && (data['Error Message'] || data.message)) throw new Error(data['Error Message'] || data.message);
  return data;
}

const num = v => (v==null||v==='') ? null : Number(v);

async function loadScanLive(){
  const warns = [];
  // 请求1+2：涨幅榜（核心）+ 最活跃榜（失败不影响主流程）。
  // 成交量 / 平均成交量不在这两个榜单里，免费版也没有批量接口，改为按需补全（enrichOne / enrichTop）。
  const [g, a] = await Promise.allSettled([ fmp('/biggest-gainers'), fmp('/most-actives') ]);
  if(g.status==='rejected') throw g.reason;
  if(a.status==='rejected') warns.push(t('activesFail',{msg:a.reason.message}));
  const list = [ ...(Array.isArray(g.value)?g.value:[]), ...(a.status==='fulfilled' && Array.isArray(a.value) ? a.value : []) ];
  const map = new Map();
  list.forEach(r => {
    const sym = r.symbol; if(!sym || map.has(sym)) return;
    map.set(sym, { symbol:sym, name:r.name||'', price:num(r.price), changePct:num(r.changesPercentage ?? r.changePercentage ?? r.changePercent), volume:null, avgVolume:null });
  });
  const fMin=+$('fMin').value, fMax=+$('fMax').value, fChg=+$('fChg').value;
  const cands = [...map.values()].filter(r => Number.isFinite(r.price) && Number.isFinite(r.changePct) && r.price>=fMin && r.price<=fMax && r.changePct>fChg).slice(0,60);
  return { rows:cands, warns };
}

/* =====================================================================
 *  交易时段 / 流动性 / 评分 / 交易计划
 * ===================================================================== */
function sessionInfo(date){
  const p = new Intl.DateTimeFormat('en-US',{ timeZone:'America/New_York', year:'numeric', month:'2-digit', day:'2-digit', weekday:'short', hour:'2-digit', minute:'2-digit', hour12:false }).formatToParts(date);
  const g = ty => p.find(x=>x.type===ty).value;
  const day = `${g('year')}-${g('month')}-${g('day')}`, wd = g('weekday'), min = (+g('hour')%24)*60 + +g('minute');
  const base = { min, day, closeMin:960 };
  if(wd==='Sat'||wd==='Sun') return { ...base, key:'closed', label:t('sessWeekend'), color:'#a09dc8' };
  if(US_HOLIDAYS[day])        return { ...base, key:'closed', label:t('sessHoliday'), color:'#a09dc8' };
  const early = !!US_EARLY_CLOSE[day], closeMin = early ? 780 : 960, afterEnd = early ? 1020 : 1200, tag = early ? t('earlyTag') : '';
  const o = { ...base, closeMin };
  if(min>=240 && min<570)        return { ...o, key:'pre',     label:t('sessPre'),     color:'#ffb547' };
  if(min>=570 && min<585)        return { ...o, key:'open',    label:t('sessOpen')+tag, color:'#ff8a5c' };
  if(min>=585 && min<closeMin)   return { ...o, key:'regular', label:t('sessRegular')+tag, color:'#34e0a1' };
  if(min>=closeMin && min<afterEnd) return { ...o, key:'after', label:t('sessAfter'),   color:'#ffb547' };
  return { ...o, key:'closed', label:t('sessClosed'), color:'#a09dc8' };
}
const etSession = () => sessionInfo(new Date());
const isOffHours = ses => ['pre','after','open'].includes(ses.key);

/* 预计「此时已完成的全天成交量比例」。date 应取数据抓取的时间，而不是现在。 */
function volFraction(date){
  const s = sessionInfo(date);
  if(s.key==='pre') return { frac:VOL_FLOOR, floor:true };
  if(s.key==='open' || s.key==='regular'){
    const off = Math.max(0, Math.min(390, (s.min-570)*390/(s.closeMin-570)));   // 提前收市日按比例拉伸
    let f = 1;
    for(let i=1;i<VOL_CURVE.length;i++){
      const [x0,y0]=VOL_CURVE[i-1], [x1,y1]=VOL_CURVE[i];
      if(off<=x1){ f = y0+(y1-y0)*(off-x0)/(x1-x0); break; }
    }
    return { frac:Math.max(VOL_FLOOR,f), floor:f<VOL_FLOOR };
  }
  return { frac:1, floor:false };      // 盘后 / 休市：成交量已是（接近）全天数据
}
/* 计算每只股票的 RVOL（原始 & 折算）。折算按「该股报价的时刻」；模拟数据不折算。 */
function applyRvol(){
  state.rvolOn = $('rvolAdj').checked;
  const vf0 = state.live && state.rvolOn ? volFraction(new Date(state.scanTs || Date.now())) : { frac:1, floor:false };
  state.rvolFrac = vf0.frac; state.rvolFloor = vf0.floor;
  state.raw.forEach(r => {
    if(r.volume>0 && r.avgVolume>0){
      r.rvolRaw = +(r.volume/r.avgVolume).toFixed(2);
      const frac = (r.mock || !state.live || !state.rvolOn) ? 1 : volFraction(new Date(r.dataTs || state.scanTs || Date.now())).frac;
      r.rvol = +(r.rvolRaw/frac).toFixed(2);
    } else { r.rvolRaw = null; r.rvol = null; }
  });
}

function liquidityEstimate(s, ses){
  // 经验性启发式：低价股、低成交量、非常规时段 → 点差更大。并非真实报价点差。
  let score = 0;
  if(s.price < 3) score += 2; else if(s.price < 10) score += 1;
  if(s.volume != null){ if(s.volume < 500000) score += 2; else if(s.volume < 2000000) score += 1; }
  if(s.rvol != null && s.rvol > 8) score += 1;                     // 极端放量常伴随点差剧烈波动
  if(Math.abs(s.changePct) > 15) score += 1;
  if(s.marketCap>0){ if(s.marketCap<5e7) score += 2; else if(s.marketCap<3e8) score += 1; }   // 极小市值：点差/停牌风险更高
  if(isOffHours(ses)) score += 2;
  if(ses.key==='closed') score += 1;
  if(score >= 5) return { lvl:'bad',  lv:t('liqBad'),  color:'var(--coral)', note:t('liqBadNote') };
  if(score >= 3) return { lvl:'mid',  lv:t('liqMid'),  color:'#ffb547',     note:t('liqMidNote') };
  return               { lvl:'good', lv:t('liqGood'), color:'var(--mint)',  note:t('liqGoodNote') };
}

/* 规则打分（0–100）：涨幅 35 + RVOL 30 + 成交量 20 + 价格区间 10，归一化后扣除时段惩罚 */
function scoreStock(s, ses){
  const c = s.changePct, r = s.rvol, v = s.volume, p = s.price;
  const mom = c<3 ? 0 : c<=12 ? 15+20*(c-3)/9 : c<=20 ? 35-15*(c-12)/8 : Math.max(0, 20-(c-20));
  const rv  = r==null ? 10 : r<2 ? 0 : Math.min(30, 15+15*(r-2)/4);
  const vol = v==null ? 8 : v>=5e6 ? 20 : v>=2e6 ? 14+6*(v-2e6)/3e6 : v>=5e5 ? 6+8*(v-5e5)/1.5e6 : 6*v/5e5;
  const pr  = (p>=3 && p<=30) ? 10 : (p>30 && p<=50) ? 7 : (p>=1 && p<3) ? 4 : 0;
  const pen = isOffHours(ses) ? 8 : ses.key==='closed' ? 3 : 0;
  const score = Math.round(Math.max(0, Math.min(100, (mom+rv+vol+pr)/95*100 - pen)));
  const liq = liquidityEstimate(s, ses);
  let grade = score>=70 ? 'strong' : score>=50 ? 'watch' : 'skip';
  if(liq.lvl==='bad') grade = 'skip';
  else if(r==null && grade==='strong') grade = 'watch';      // 没有量能数据，不能给最高评级

  const reasons = [];
  if(c>20) reasons.push({tone:'bad',  txt:t('rsnMomHot',{v:fmt(c,1)})});
  else if(c>=3) reasons.push({tone:'good', txt:t('rsnMomOk',{v:fmt(c,1)})});
  else reasons.push({tone:'warn', txt:t('rsnMomWeak',{v:fmt(c,1)})});
  if(r==null) reasons.push({tone:'warn', txt:t('rsnRvolNA')});
  else if(r>=3) reasons.push({tone:'good', txt:t('rsnRvolHigh',{v:fmt(r,1)})});
  else if(r>=2) reasons.push({tone:'neutral', txt:t('rsnRvolOk',{v:fmt(r,1)})});
  else reasons.push({tone:'warn', txt:t('rsnRvolLow',{v:fmt(r,1)})});
  if(r!=null && r>=50) reasons.push({tone:'warn', txt:t('rsnRvolExtreme',{v:fmt(r,0)})});
  if(s.marketCap>0 && s.marketCap<5e7) reasons.push({tone:'bad', txt:t('rsnMicroCap',{v:fmtVol(s.marketCap)})});
  if(v!=null){
    if(v>=2e6) reasons.push({tone:'good', txt:t('rsnVolHigh',{v:fmtVol(v)})});
    else if(v<5e5) reasons.push({tone:'warn', txt:t('rsnVolLow',{v:fmtVol(v)})});
  }
  if(p<3) reasons.push({tone:'warn', txt:t('rsnPriceLow')});
  if(isOffHours(ses)) reasons.push({tone:'warn', txt:t('rsnSess')});
  if(liq.lvl==='bad') reasons.push({tone:'bad', txt:t('rsnLiqBad')});
  return { score, grade, reasons, liq };
}

/* 交易计划：
 *  有效风险% = 止损% + 往返点差%；仓位 = 可承受亏损 ÷ 有效风险%（不加杠杆，封顶本金）；
 *  目标涨幅% = 有效风险% × 盈亏比 + 点差%，使「扣除点差后」的净盈亏比等于你设定的 R:R。 */
function tradePlan(s){
  const cap=+$('pCap').value, risk=+$('pRisk').value, stop=+$('pStop').value, rr=+$('pRR').value;
  const pull=+$('pPull').value, cost=+$('pCost').value;
  if(!(cap>0 && risk>0 && stop>0 && rr>0) || !(pull>=0) || !(cost>=0)) return { valid:false };
  const eff = stop + cost;
  const entry = s.price*(1-pull/100);
  const stopPx = entry*(1-stop/100), target = entry*(1+(eff*rr+cost)/100);
  let pos = (cap*risk/100)/(eff/100), capped = false;
  if(pos>cap){ pos = cap; capped = true; }
  return { valid:true, entry, stopPx, target, pos, capped, units:pos/entry, riskUsd:pos*eff/100, gainUsd:pos*eff*rr/100 };
}

        <div class="pick-id"><b>${esc(s.symbol)}</b><span class="nm muted">${esc(s.name)}</span></div>
        <div class="pick-px"><span class="px">$${fmt(s.price)}</span><span class="pill ${up?'pill-up':'pill-down'}">${up?'+':''}${fmt(s.changePct)}%</span></div>
        <div class="ring" style="--p:${r.score};--c:${g.color}" title="${t('score')} ${r.score}"><span>${r.score}</span></div>
      </div>
      <div class="pick-meta">
        <span class="grade" style="--cc:${g.color}">${g.txt}</span>${chips}
        <button type="button" class="btn btn-sm pcopy" data-sym="${esc(s.symbol)}" aria-label="${t('copyBtn')}">📋</button>
      </div>
      ${plan}
    </div>`;
  }).join('');
  box.querySelectorAll('.pick').forEach(el => {
    el.onclick = () => selectStock(el.dataset.sym, true);
    el.onkeydown = e => { if(e.target===el && (e.key==='Enter' || e.key===' ')){ e.preventDefault(); selectStock(el.dataset.sym, true); } };
  });
  box.querySelectorAll('.pcopy').forEach(b => b.onclick = e => { e.stopPropagation(); copySym(b.dataset.sym); });
}

/* =====================================================================
 *  选中股票 + eToro 风控卡片（纯本地，不请求 API）
 * ===================================================================== */
/* ---------------------------- 按需补全（只用 /stable/profile：一次请求同时拿到成交量与平均成交量） ----------------------------
 * 实测：/quote 对小盘股（如 ONEG）返回 402「该 symbol 不在你的套餐内」，/profile 可用，所以不再使用 /quote。 */
const quoteTtl = () => etSession().key==='closed' ? 6*3600e3 : 5*60e3;       // 休市时数据不变，缓存更久
const isBlocked = sym => { const b = lsGet('dt_bad_'+sym); return !!(b && Date.now()-b.ts < 24*3600e3); };
const quoteFresh = r => isBlocked(r.symbol) || !!(r.fetchedAt && Date.now()-r.fetchedAt < quoteTtl() && r.avgVolume>0);

/* 成功返回 null；失败抛错（含「无权限」「缺字段」）。 */
async function enrichOne(stock){
  const sym = stock.symbol;
  if(isBlocked(sym)) throw new Error(t('symRestricted'));
  const pk = 'dt_p_'+sym, pc = lsGet(pk);
  let pf, fetchedAt;
  if(pc && Date.now()-pc.ts < quoteTtl()){ pf = pc.d; fetchedAt = pc.ts; }
  else {
    let r;
    try{ r = await fmp('/profile', { symbol:sym }); }
    catch(e){
      if(/\b402\b/.test(e.message)){                                        // 该股票不在套餐内：24 小时内不再请求
        lsSet('dt_bad_'+sym, { ts:Date.now() });
        if(++state.failStreak >= 3) state.noProfile = true;                 // 连续 3 只都被拒：判定整体不可用，停止
        throw new Error(t('symRestricted'));
      }
      if(/\b401\b/.test(e.message)) state.noProfile = true;                // Key 无效
      throw e;
    }
    const raw = Array.isArray(r) ? r[0] : r;
    if(!raw) throw new Error('empty profile');
    pf = { price:raw.price, changePercentage:raw.changePercentage ?? raw.changesPercentage, volume:raw.volume, averageVolume:raw.averageVolume ?? raw.avgVolume, marketCap:raw.marketCap };
    fetchedAt = Date.now(); lsSet(pk, { ts:fetchedAt, d:pf });
  }
  state.failStreak = 0;
  const price = num(pf.price); if(price>0) stock.price = price;
  const chg = num(pf.changePercentage); if(Number.isFinite(chg)) stock.changePct = chg;
  stock.volume = num(pf.volume);
  stock.marketCap = num(pf.marketCap);
  const avg = num(pf.averageVolume);
  if(avg>0) stock.avgVolume = avg;
  stock.dataTs = fetchedAt; stock.fetchedAt = fetchedAt;                   // profile 没有时间戳，按抓取时刻折算
  lsSet(LS.scan, { ts:state.scanTs, rows:state.raw });
  if(!(avg>0)) throw new Error(t('avgFail',{msg:'averageVolume missing'}));
  return null;
}

async function enrichTop(){
  if(!state.live){ toast(t('enrichMock')); return; }
  if(state.noProfile){ toast(t('noProfileStop'), 8000); return; }
  const ses = etSession();
  const top = state.raw.filter(passFilter).map(s => ({ s, ...scoreStock(s, ses) })).sort((a,b)=>b.score-a.score).slice(0, ENRICH_N).map(x=>x.s);
  const need = top.filter(r => !quoteFresh(r));
  if(!need.length){ toast(t('enrichNone')); return; }
  if(!confirm(t('confirmEnrich',{ n:need.length, req:need.length, used:quota().used, limit:DAILY_LIMIT }))) return;
  const btn = $('btnEnrich'); btn.disabled = true; btn.textContent = t('loading');
  let done = 0, failed = 0;
  try{
    for(const r of need){
      try{ await enrichOne(r); done++; } catch(e){ failed++; }
      if(state.noProfile) break;
    }
  } finally {
    btn.disabled = !state.live; btn.textContent = t('enrichBtn');
    renderAll();
  }
  if(state.noProfile) toast(t('noProfileStop'), 8000);
  else toast(failed ? t('enrichDonePart',{n:done, f:failed}) : t('enrichDone',{n:done}), failed ? 7000 : 3200);
}

async function selectStock(sym, scroll=false){
  const stock = state.raw.find(r=>r.symbol===sym); if(!stock) return;
  state.selected = stock;
  renderScan(); renderPicks(); renderSelected();
  $('btnCopy').disabled = false;
  if(scroll && window.matchMedia('(max-width:1023px)').matches) $('riskCard').scrollIntoView({ behavior:'smooth', block:'start' });
  if(state.live && !state.noProfile && !quoteFresh(stock)){                  // 点击才请求该股数据（懒加载）
    $('selName').textContent = t('quoteLoading');
    try{ await enrichOne(stock); }
    catch(e){ toast(t('quoteFail',{msg:e.message}), 7000); }
    if(state.selected?.symbol === sym) renderAll();
  }
}

function renderStrip(){
  const s = sessionInfo(new Date());
  const start = 240, afterEnd = s.closeMin===780 ? 1020 : 1200, total = afterEnd - start;
  const segs = [['pre',240,570,'segPre'],['open',570,585,'segOpen'],['regular',585,s.closeMin,'segReg'],['after',s.closeMin,afterEnd,'segAfter']];
  $('sessBar').innerHTML = segs.map(([k,a,b,lab]) => `<i class="seg seg-${k} ${s.key===k?'cur':''}" style="flex:${b-a}"><em>${(b-a)>=60 ? t(lab) : ''}</em></i>`).join('');
  const hh = String(Math.floor(s.min/60)).padStart(2,'0'), mm = String(s.min%60).padStart(2,'0');
  $('sessLabel').textContent = s.label;
  $('sessClock').textContent = `${t('stripTitle')} ${hh}:${mm}`;
  $('sessDot').style.setProperty('--dot', s.color);
  $('sessNote').textContent = s.key==='regular' ? t('stripTight') : s.key==='closed' ? t('stripClosed') : t('stripWide');
  const fmtT = m => `${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}`;
  const ticks = [[240,0],[570,(570-start)/total*100],[s.closeMin,(s.closeMin-start)/total*100],[afterEnd,100]];
  $('sessTicks').innerHTML = ticks.map(([m,p]) => `<span style="left:${p}%">${fmtT(m)}</span>`).join('');
  const now = $('sessNow'), live = ['pre','open','regular','after'].includes(s.key);
  now.classList.toggle('off', !live);
  $('sessTrack').setAttribute('aria-label', `${s.label} ${hh}:${mm} ET`);
  if(live){
    const pos = Math.max(0, Math.min(100, (s.min-start)/total*100));
    $('sessNowTime').textContent = `${hh}:${mm}`;
    now.classList.toggle('edge-l', pos<9); now.classList.toggle('edge-r', pos>91);
    if(!renderStrip.done){ now.style.setProperty('--p','0%'); requestAnimationFrame(() => requestAnimationFrame(() => now.style.setProperty('--p', pos+'%'))); renderStrip.done = true; }
    else now.style.setProperty('--p', pos+'%');
  }
}
function renderSession(){
  const ses = etSession(), sb = $('sessionBadge');
  sb.textContent = ses.label; sb.style.color = ses.color;
  renderStrip();
  return ses;
}

function renderSelected(){
  const s = state.selected, ses = renderSession();
  if(!s){
    $('selSym').textContent = '—'; $('selPrice').textContent = ''; $('selChg').textContent = '';
    $('selName').textContent = t('selectHint');
    ['liqLevel','rkEntry','rkStop','rkTarget','rkSize'].forEach(id => { $(id).textContent = '—'; });
    $('liqLevel').style.color = ''; $('liqNote').textContent = ''; $('rkRiskLine').textContent = ''; $('liqMeter').dataset.lvl = '';
    $('btnCopy').disabled = true;
    return;
  }
  $('selSym').textContent = s.symbol;
  $('selPrice').textContent = '$'+fmt(s.price);
  $('selChg').innerHTML = `<span class="pill ${s.changePct>=0?'pill-up':'pill-down'}" style="font-size:13px">${s.changePct>=0?'+':''}${fmt(s.changePct)}%</span>`;
  $('selName').textContent = s.name + (s.rvol!=null ? ` · RVOL ${fmt(s.rvol,1)}x` : '');
  const est = liquidityEstimate(s, ses);
  $('liqLevel').textContent = est.lv; $('liqLevel').style.color = est.color; $('liqMeter').dataset.lvl = est.lvl;
  $('liqNote').textContent = est.note + (isOffHours(ses) ? t('offHours') : '');
  const pl = tradePlan(s);
  if(pl.valid){
    $('rkEntry').textContent = usd(pl.entry); $('rkStop').textContent = usd(pl.stopPx); $('rkTarget').textContent = usd(pl.target);
    $('rkSize').textContent = `$${Math.round(pl.pos)} (${t('plUnits',{u:fmt(pl.units,2)})})`;
    $('rkRiskLine').textContent = t('plRiskLine',{risk:fmt(pl.riskUsd,2), gain:fmt(pl.gainUsd,2)}) + (pl.capped ? ' ' + t('plCapped') : '');
  } else {
    ['rkEntry','rkStop','rkTarget','rkSize'].forEach(id => { $(id).textContent = '—'; });
    $('rkRiskLine').textContent = t('plInvalid');
  }
}

/* ---------------------------- 复制 Ticker ---------------------------- */
async function copySym(sym){
  if(!sym) return;
  try{ await navigator.clipboard.writeText(sym); }
  catch{ const ta=document.createElement('textarea'); ta.value=sym; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
  toast(t('copied',{sym}));
}

/* =====================================================================
 *  模式切换 / Key 设置 / 语言切换 / 初始化
 * ===================================================================== */
function renderAll(){ applyRvol(); renderScan(); renderPicks(); renderSelected(); }

function renderMode(){
  $('modeMock').classList.toggle('on', !state.live);
  $('modeLive').classList.toggle('on', state.live);
  $('modeSwitch').setAttribute('aria-checked', state.live ? 'true' : 'false');
}
function setMode(live){
  if(live && !getKey()){ toast(t('needKey'), 4500); $('keyBar').classList.remove('hidden'); return; }
  state.live = live; lsSet(LS.mode, live); renderMode();
  state.raw = []; state.scanTs = null; state.selected = null;
  if(live){
    const c = lsGet(LS.scan);                    // 真实模式：先展示上次缓存，不自动请求
    if(c && c.rows){ state.raw = c.rows; state.scanTs = c.ts; toast(t('loadedCache')); }
  } else {
    state.raw = MOCK_SCAN.map(r=>({...r})); state.scanTs = Date.now();
  }
  renderAll();
}

/* 应用语言：刷新所有静态文案 + 重新渲染动态内容 */
function applyLang(){
  document.documentElement.lang = LANG==='zh' ? 'zh-CN' : 'en';
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll('[data-i18n-title]').forEach(el => { el.title = t(el.dataset.i18nTitle); });
  document.querySelectorAll('[data-i18n-aria]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
  $('langSel').value = LANG;
  renderMode(); renderQuota(); renderAll();
}
function setLang(l){
  if(!I18N[l]) return;
  LANG = l; lsSet(LS.lang, l); applyLang();
}

$('langSel').onchange = e => setLang(e.target.value);
$('modeSwitch').onclick = () => setMode(!state.live);
$('modeSwitch').onkeydown = e => { if(e.key==='Enter' || e.key===' '){ e.preventDefault(); setMode(!state.live); } };
$('btnRefresh').onclick = refreshScan;
$('btnCopy').onclick = () => copySym(state.selected?.symbol);
$('btnEnrich').onclick = enrichTop;
['fChg','fRvol','fMin','fMax'].forEach(id => $(id).addEventListener('input', () => { renderScan(); renderPicks(); }));
$('rvolAdj').onchange = () => { lsSet(LS.rvolAdj, $('rvolAdj').checked); renderAll(); };
['pCap','pRisk','pStop','pRR','pPull','pCost'].forEach(id => $(id).addEventListener('input', () => { saveRiskInputs(); renderPicks(); renderSelected(); }));
$('btnKey').onclick = () => { $('keyBar').classList.toggle('hidden'); $('keyInput').value = lsGet(LS.key) || ''; };
$('keySave').onclick = () => { lsSet(LS.key, $('keyInput').value.trim()); toast(t('keySaved')); $('keyBar').classList.add('hidden'); };
$('keyClear').onclick = () => { localStorage.removeItem(LS.key); $('keyInput').value=''; toast(t('keyCleared')); };

/* 初始化：不自动请求任何数据 */
loadRiskInputs();
$('rvolAdj').checked = lsGet(LS.rvolAdj, true) !== false;
if(state.live && !getKey()) state.live = false;
applyLang();
setMode(state.live);
setInterval(renderSession, 30000);

/* PWA：注册 Service Worker（仅 https / localhost 生效） */
if('serviceWorker' in navigator){ window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
